<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路线优化 v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { --bg:#0f0f0f;--surface:#1a1a1a;--border:#2a2a2a;--accent:#00e5a0;--accent2:#ff6b35;--text:#e8e8e8;--muted:#666;--danger:#ff4444; }
  * { box-sizing:border-box;margin:0;padding:0; }
  body { background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;padding:16px;max-width:600px;margin:0 auto; }
  h1 { font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--accent);letter-spacing:.05em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border); }
  .section { background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px; }
  .section-title { font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px; }
  textarea { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;outline:none;resize:vertical;min-height:200px;transition:border-color .2s; }
  textarea:focus { border-color:var(--accent); }
  .hint { font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5; }
  .parsed-list { margin-top:10px; }
  .parsed-item { display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px; }
  .parsed-item:last-child { border-bottom:none; }
  .parsed-num { font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);width:18px;text-align:right;flex-shrink:0; }
  .parsed-addr { flex:1; }
  .toggle-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
  .toggle-label { font-size:13px;flex:1; }
  .toggle { position:relative;width:40px;height:22px;flex-shrink:0; }
  .toggle input { opacity:0;width:0;height:0; }
  .slider { position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s; }
  .slider:before { content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s; }
  input:checked+.slider { background:var(--accent); }
  input:checked+.slider:before { transform:translateX(18px); }
  input[type="text"] { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;margin-bottom:8px; }
  input[type="text"]:focus { border-color:var(--accent); }
  .btn-main { background:var(--accent);border:none;border-radius:8px;color:#000;padding:14px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;width:100%;letter-spacing:.05em;transition:opacity .2s;margin-bottom:8px; }
  .btn-main:hover { opacity:.85; }
  .btn-main:disabled { opacity:.35;cursor:not-allowed; }
  .btn-secondary { background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:10px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;width:100%;transition:all .2s;margin-bottom:12px; }
  .btn-secondary:hover { border-color:var(--accent);color:var(--accent); }
  .status { font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:center;padding:8px;min-height:30px; }
  .status.loading { color:var(--accent); }
  .status.error { color:var(--danger); }
  .status.success { color:var(--accent); }
  .stats-row { display:flex;gap:10px;margin-bottom:12px; }
  .stat { flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center; }
  .stat-val { font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--accent);font-weight:600; }
  .stat-label { font-size:10px;color:var(--muted);margin-top:3px; }
  .result-item { display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start; }
  .result-item:last-child { border-bottom:none; }
  .result-num { font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--accent);color:#000;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;margin-top:1px; }
  .result-num.special { background:var(--accent2); }
  .result-addr { font-size:13px;line-height:1.4;flex:1; }
  .maps-segment { margin-bottom:10px; }
  .maps-seg-label { font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:4px; }
  .maps-btn { display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:11px 14px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;transition:border-color .2s; }
  .maps-btn:hover { border-color:var(--accent);color:var(--accent); }
</style>
</head>
<body>
<h1>&#9658; ROUTE OPTIMIZER v2</h1>
<div class="section">
  <div class="section-title">&#9312; 粘贴 Claude 输出的地址</div>
  <textarea id="paste-input" placeholder="直接粘贴 Claude 给你的路线清单"></textarea>
  <div class="hint">支持带编号、emoji、中文标注的格式，自动提取地址行</div>
  <button class="btn-secondary" onclick="parseInput()" style="margin-top:10px;margin-bottom:0">解析地址 →</button>
  <div id="parsed-preview" class="parsed-list" style="display:none"></div>
</div>
<div class="section">
  <div class="section-title">&#9313; 设置</div>
  <div class="toggle-row">
    <span class="toggle-label">自动优化顺序（ORS）</span>
    <label class="toggle"><input type="checkbox" id="do-optimize" checked><span class="slider"></span></label>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">终点固定为家</span>
    <label class="toggle"><input type="checkbox" id="fix-home" checked><span class="slider"></span></label>
  </div>
  <input type="text" id="home-addr" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="家的地址">
  <div class="toggle-row" style="margin-bottom:0"><span class="toggle-label">起点</span></div>
  <input type="text" id="origin-addr" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="当前位置" style="margin-bottom:0">
</div>
<button class="btn-main" onclick="runOptimize()" id="btn-run">&#9654; 优化并生成导航</button>
<div class="status" id="status"></div>
<div id="result-section" style="display:none">
  <div class="section">
    <div class="section-title">路线统计</div>
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="stat-dist">—</div><div class="stat-label">km</div></div>
      <div class="stat"><div class="stat-val" id="stat-time">—</div><div class="stat-label">分钟</div></div>
      <div class="stat"><div class="stat-val" id="stat-stops">—</div><div class="stat-label">站点</div></div>
    </div>
  </div>
  <div class="section"><div class="section-title">优化后顺序</div><div id="route-list"></div></div>
  <div class="section"><div class="section-title">Google Maps 导航链接</div><div id="maps-links"></div></div>
</div>
<script>
const ORS_KEY='eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImFjNzQxYjYwZmZhZTQ0NDliMGQ1NzFjM2MyN2NmMGQ4IiwiaCI6Im11cm11cjY0In0=';
let parsedAddresses=[];
function parseInput(){
  const raw=document.getElementById('paste-input').value;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const addresses=[];
  for(const line of lines){
    const cleaned=line.replace(/^\d+\.\s*/,'').replace(/^[\u{1F4E4}\u{1F4E5}\u{1F504}\u{1F519}\u{1F3E0}\u2705\u23F3\u{1F4E6}\u26A0}]+\s*/u,'').replace(/^(取件|送件|Transfer|退回|回家)[—\-\s]*/u,'').replace(/\s*\(Job\s*\d+\)/gi,'').trim();
    const hasNumber=/\d/.test(cleaned);
    const hasStreetWord=/(st|ave|blvd|dr|cres|crescent|trail|rd|way|hwy|pkwy|cove|place|pl|court|ct|circle|lane|ln|drive|street|avenue|road)/i.test(cleaned);
    const hasWinnipeg=/winnipeg|MB|R\d[A-Z]\s*\d[A-Z]\d/i.test(cleaned);
    if(cleaned.length<8)continue;
    if(/^(今日|剩余|已完成|当前位置|进度|路线|导航|google)/i.test(cleaned))continue;
    if(/^(job \d+|#\d+)/i.test(cleaned))continue;
    if(hasNumber&&(hasStreetWord||hasWinnipeg)){
      let addr=cleaned;
      if(!/winnipeg/i.test(addr))addr+=', Winnipeg, MB';
      if(!/canada|MB/i.test(addr))addr+=', Canada';
      addresses.push({raw:cleaned,addr,include:true});
    }
  }
  parsedAddresses=addresses;
  const preview=document.getElementById('parsed-preview');
  if(addresses.length===0){preview.style.display='block';preview.innerHTML='<div style="color:var(--danger);font-size:12px;padding:8px 0">未识别到地址</div>';return;}
  preview.style.display='block';
  preview.innerHTML=addresses.map((a,i)=>`<div class="parsed-item"><span class="parsed-num">${i+1}</span><span class="parsed-addr">${a.raw}</span><label class="toggle" style="width:34px;height:20px"><input type="checkbox" checked onchange="parsedAddresses[${i}].include=this.checked"><span class="slider"></span></label></div>`).join('');
}
async function geocode(address){
  const url=`https://api.openrouteservice.org/geocode/search?api_key=${ORS_KEY}&text=${encodeURIComponent(address)}&boundary.country=CA&size=1`;
  const r=await fetch(url);
  if(!r.ok)throw new Error(`Geocode HTTP ${r.status}`);
  const d=await r.json();
  if(!d.features||d.features.length===0)throw new Error(`找不到: ${address}`);
  return d.features[0].geometry.coordinates;
}
async function runOptimize(){
  const btn=document.getElementById('btn-run');
  if(parsedAddresses.length===0)parseInput();
  const active=parsedAddresses.filter(a=>a.include);
  if(active.length===0){setStatus('请先粘贴地址并解析','error');return;}
  const originStr=document.getElementById('origin-addr').value.trim();
  const homeStr=document.getElementById('home-addr').value.trim();
  const fixHome=document.getElementById('fix-home').checked;
  const doOptimize=document.getElementById('do-optimize').checked;
  btn.disabled=true;
  document.getElementById('result-section').style.display='none';
  try{
    const allStrs=[originStr,...active.map(a=>a.addr)];
    if(fixHome)allStrs.push(homeStr);
    const coords=[];
    for(let i=0;i<allStrs.length;i++){setStatus(`解析地址 ${i+1}/${allStrs.length}…`,'loading');coords.push(await geocode(allStrs[i]));await sleep(350);}
    const originCoord=coords[0];
    const destCoord=coords[coords.length-1];
    const stopCoords=fixHome?coords.slice(1,-1):coords.slice(1);
    const stopStrs=active.map(a=>a.raw);
    let orderedStops,orderedCoords;
    if(doOptimize&&stopCoords.length>1){
      setStatus('ORS 路线优化中…','loading');
      const body={vehicles:[{id:1,profile:'driving-car',start:originCoord,end:destCoord}],jobs:stopCoords.map((c,i)=>({id:i+1,location:c,description:stopStrs[i]}))};
      const res=await fetch('https://api.openrouteservice.org/optimization',{method:'POST',headers:{'Authorization':ORS_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){const err=await res.text();throw new Error(`ORS优化失败: ${err.slice(0,100)}`);}
      const data=await res.json();
      const steps=data.routes[0].steps.filter(s=>s.type==='job');
      orderedStops=steps.map(s=>stopStrs[s.id-1]);
      orderedCoords=steps.map(s=>stopCoords[s.id-1]);
    }else{orderedStops=stopStrs;orderedCoords=stopCoords;}
    setStatus('计算驾驶距离…','loading');
    const allCoords=[originCoord,...orderedCoords,destCoord];
    const dirRes=await fetch('https://api.openrouteservice.org/v2/directions/driving-car',{method:'POST',headers:{'Authorization':ORS_KEY,'Content-Type':'application/json'},body:JSON.stringify({coordinates:allCoords})});
    let totalDist='—',totalTime='—';
    if(dirRes.ok){const dirData=await dirRes.json();const s=dirData.routes?.[0]?.summary;if(s){totalDist=(s.distance/1000).toFixed(1);totalTime=Math.round(s.duration/60);}}
    document.getElementById('stat-dist').textContent=totalDist;
    document.getElementById('stat-time').textContent=totalTime;
    document.getElementById('stat-stops').textContent=orderedStops.length;
    const fullLabels=[originStr,...orderedStops,...(fixHome?[homeStr]:[])];
    document.getElementById('route-list').innerHTML=fullLabels.map((addr,i)=>{const isSpecial=i===0||i===fullLabels.length-1;const numLabel=i===0?'★':i===fullLabels.length-1?'🏠':i;return`<div class="result-item"><div class="result-num ${isSpecial?'special':''}">${numLabel}</div><div class="result-addr">${addr}</div></div>`;}).join('');
    const mapsContainer=document.getElementById('maps-links');mapsContainer.innerHTML='';
    const CHUNK=9;
    for(let i=0;i<fullLabels.length-1;i+=CHUNK){
      const seg=fullLabels.slice(i,Math.min(i+CHUNK+1,fullLabels.length));
      const url='https://www.google.com/maps/dir/'+seg.map(a=>encodeURIComponent(a)).join('/');
      const segNum=Math.floor(i/CHUNK)+1;const totalSegs=Math.ceil((fullLabels.length-1)/CHUNK);
      const div=document.createElement('div');div.className='maps-segment';
      div.innerHTML=`<div class="maps-seg-label">${totalSegs>1?`第 ${segNum}/${totalSegs} 段`:'完整路线'} · ${seg.length} 站</div><a href="${url}" target="_blank" class="maps-btn">&#9654; 打开 Google Maps 导航</a>`;
      mapsContainer.appendChild(div);
    }
    document.getElementById('result-section').style.display='block';
    setStatus('✓ 完成','success');
  }catch(e){setStatus('错误：'+e.message,'error');console.error(e);}
  finally{btn.disabled=false;}
}
function setStatus(msg,cls=''){const el=document.getElementById('status');el.textContent=msg;el.className='status '+cls;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
</body>
</html>
