<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700&display=swap');

  --bg:#f5f3f0;--surface:#fff;--s2:#edeae5;--b:#ddd8d0;--b2:#c8c2b8;
  --green:#2d6a4f;--orange:#c8622a;--blue:#2a5cb8;--red:#c0392b;

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:14px;max-width:640px;margin:0 auto;}
h1{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--b);}
.card{background:var(--s1);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:10px;}
.card-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px;}.paste-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}.btn-paste{background:var(--s2);border:1px solid var(--b);color:var(--text);font-family:inherit;font-size:11px;padding:5px 10px;border-radius:4px;cursor:pointer;flex-shrink:0;line-height:1;}.btn-paste:hover{border-color:var(--green);}.btn-paste:active{transform:translateY(1px);}.btn-paste.ok{border-color:var(--green);color:var(--green);}.btn-paste.err{border-color:#c54;color:#c54;}.today-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}.today-actions{display:flex;gap:6px;}.btn-mini{background:var(--s2);border:1px solid var(--b);color:var(--muted);font-family:inherit;font-size:10px;padding:4px 8px;border-radius:3px;cursor:pointer;line-height:1;}.btn-mini:hover{border-color:var(--green);color:var(--text);}.today-job{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--b);border-radius:4px;margin-bottom:6px;background:var(--bg);}.today-job.done{opacity:0.55;}.today-job-head{display:flex;align-items:center;gap:8px;font-size:11px;}.today-job-id{font-family:'JetBrains Mono',monospace;color:var(--text);font-weight:600;}.today-job-status{font-size:9px;padding:2px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em;}.today-job-status.pending{background:var(--orange);color:var(--bg);}.today-job-status.done{background:var(--green);color:var(--bg);}.today-job-addr{font-size:10px;color:var(--muted);line-height:1.5;padding-left:2px;}.today-job-addr b{color:var(--text);font-weight:normal;}.today-toggle{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--b);background:var(--bg);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;padding:0;}.today-toggle.pending{border-color:var(--orange);color:var(--orange);}.today-toggle.done{border-color:var(--green);color:var(--green);background:rgba(120,160,120,0.08);}.today-toggle:active{transform:scale(0.92);}.today-job-head{align-items:center;}
textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;outline:none;resize:vertical;min-height:180px;}
textarea:focus{border-color:var(--green);}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.6;}
.hint code{color:var(--orange);background:var(--s2);padding:1px 4px;border-radius:2px;}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;margin-bottom:8px;}
input[type=text]:focus{border-color:var(--green);}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.row label{font-size:12px;flex:1;}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0;}

.knob{position:absolute;inset:0;background:var(--b2);border-radius:10px;cursor:pointer;transition:background .2s;}
.knob:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#ccc;border-radius:50%;transition:transform .2s,background .2s;}
input:checked+.knob{background:var(--green);}
input:checked+.knob:before{transform:translateX(18px);background:#fff;}
.btn-parse{width:100%;background:none;border:1px dashed var(--b2);border-radius:4px;color:var(--muted);padding:9px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:8px;transition:all .2s;}
.btn-parse:hover{border-color:var(--green);color:var(--green);}

.btn-run:hover{opacity:.85;}
.btn-run:disabled{opacity:.3;cursor:not-allowed;}
.status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:6px;min-height:28px;}
.status.loading{color:var(--green);}

.parsed-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);}

.p-type.deliver_only{background:#e8eef8;color:var(--blue);}
.p-job{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);flex-shrink:0;margin-top:2px;width:60px;}
.p-addr{font-size:12px;line-height:1.4;}
.stats{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:10px;text-align:center;}

.r-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--b);align-items:flex-start;}
.r-item:last-child{border-bottom:none;}
.r-num{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--green);color:#fff;width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.r-num.sp{background:var(--orange);}
.r-body{flex:1;}
.r-addr{font-size:12px;line-height:1.4;}
.r-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 5px;border-radius:2px;margin-right:4px;margin-bottom:3px;}
.r-tag.pickup{background:#e6f4ed;color:var(--green);}
.r-tag.deliver{background:#fdf0e6;color:var(--orange);}
.r-tag.deliver_only{background:#e8eef8;color:var(--blue);}
.maps-seg{margin-bottom:8px;}
.maps-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:3px;}
.maps-a{display:block;background:var(--s2);border:1px solid var(--b);border-radius:4px;color:var(--text);padding:10px 12px;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:11px;transition:border-color .2s;}
.maps-a:hover{border-color:var(--green);color:var(--green);}
</style>

<body>
<h1>&#9658;&#9658; Route Optimizer v3.2</h1>
<div class="card">
  <div class="paste-bar">
    <div class="card-title" style="margin-bottom:0">① 粘贴 Claude 输出</div>
    <button type="button" class="btn-paste" onclick="doPaste(this)">📋 一键粘贴</button>
  </div>
  <textarea id="paste-in" oninput="onPasteInput()" placeholder="PICKUP|2394568|1625 Kenaston Blvd, Winnipeg, MB R3P 2M4
DELIVER|2394568|101 Amber Trail, Winnipeg, MB R2P
DELIVER_ONLY|2393945|14 Wentwood Crescent, Winnipeg, MB R2P 2A8
HOME|16 Steeprock Cove, Winnipeg, MB R3Y 0L3"></textarea>
  <div class="hint">格式：<code>PICKUP|Job号|地址</code> / <code>DELIVER|Job号|地址</code> / <code>DELIVER_ONLY|任意|地址</code> / <code>HOME|地址</code></div>
  <button class="btn-parse" onclick="doParse()">解析 →</button>

</div>
<div class="card" id="today-card" style="display:none">
  <div class="today-bar">
    <div class="card-title" id="today-title" style="margin-bottom:0">今日订单</div>
    <div class="today-actions">
      <button type="button" class="btn-mini" onclick="clearToday()">清空今日</button>

</div>
<div class="card">
  <div class="card-title">② 设置</div>
  <div class="row">
    <label>ORS 自动优化（多次模拟取最优）</label>
    <label class="toggle"><input type="checkbox" id="do-opt" checked><span class="knob"></span></label>
  </div>
  <div class="row" style="margin-bottom:10px">
    <label>终点固定为家</label>
    <label class="toggle"><input type="checkbox" id="fix-home" checked><span class="knob"></span></label>
  </div>
  <input type="text" id="origin" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="起点（当前位置）">
  <input type="text" id="home" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="家的地址" style="margin-bottom:0">
</div>
<button class="btn-run" id="btn-run" onclick="doRun()">&#9654; 优化并生成导航</button>
<div class="status" id="status"></div>
<div id="results" style="display:none">
  <div class="card">
    <div class="card-title">路线统计</div>
    <div class="sim-bar" id="sim-info"></div>
    <div class="stats">
      <div class="stat"><div class="stat-v" id="s-dist">—</div><div class="stat-l">km 驾驶</div></div>
      <div class="stat"><div class="stat-v" id="s-time">—</div><div class="stat-l">分钟</div></div>
      <div class="stat"><div class="stat-v" id="s-stops">—</div><div class="stat-l">站点</div></div>
    </div>
  </div>
  <div class="card"><div class="card-title">优化路线</div><div id="route-out"></div></div>
  <div class="card"><div class="card-title">Google Maps 导航</div><div id="maps-out"></div></div>
</div>
<script>
const ORS='eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImFjNzQxYjYwZmZhZTQ0NDliMGQ1NzFjM2MyN2NmMGQ4IiwiaCI6Im11cm11cjY0In0=';
const MAPBOX='pk.eyJ1Ijoia2tvZm9yIiwiYSI6ImNtb3QweXJ5dzAxZzAycHB3MmJ4aWpuYzgifQ.qd7Xmb8bp707fmWycggMWA';
const SIM_RUNS=15; // number of simulation runs
let parsed=[];


// ── Geo helpers ───────────────────────────────────────────────────
function dist2(a, b){
  const dx=a[0]-b[0], dy=a[1]-b[1];
  return dx*dx+dy*dy;
}

// Greedy nearest-neighbor pre-sort respecting shipment pickup-before-delivery
// coords: array of [lng,lat], items: corresponding item array
// Returns reordered [items, coords]
function nearestNeighborSort(originC, items, coords, shipments){
  const n = items.length;
  const visited = new Array(n).fill(false);
  const result = [], resultCoords = [];

  // Build set of delivery indices that require their pickup to be done first
  // pickupDone[deliveryIdx] = pickupIdx
  const requiresPickup = {}; // deliveryItemIndex -> pickupItemIndex
  shipments.forEach(s => {
    const pickupIdx = items.indexOf(s.pickupItem);
    const deliverIdx = items.indexOf(s.deliverItem);
    if(pickupIdx >= 0 && deliverIdx >= 0)
      requiresPickup[deliverIdx] = pickupIdx;
  });

  let cur = originC;
  for(let step = 0; step < n; step++){
    let best = -1, bestDist = Infinity;
    for(let i = 0; i < n; i++){
      if(visited[i]) continue;
      // Check pickup constraint: if this is a delivery, its pickup must be done
      if(requiresPickup[i] !== undefined){
        const pickupIdx = requiresPickup[i];
        if(!visited[pickupIdx]) continue; // skip - pickup not done yet
      }
      const d = dist2(cur, coords[i]);
      if(d < bestDist){ bestDist = d; best = i; }
    }
    if(best < 0) break;
    visited[best] = true;
    result.push(items[best]);
    resultCoords.push(coords[best]);
    cur = coords[best];
  }
  return [result, resultCoords];
}

// Score a route for backtracking: penalize direction reversals
// A "reversal" = moving north then south (or E/W equivalent) sharply
function backtrackScore(originC, orderedCoords, homeC){
  const allPts = [originC, ...orderedCoords, ...(homeC ? [homeC] : [])];
  let penalty = 0;
  for(let i = 1; i < allPts.length - 1; i++){
    const prev = allPts[i-1], cur = allPts[i], next = allPts[i+1];
    // Direction vectors
    const d1lat = cur[1] - prev[1];
    const d2lat = next[1] - cur[1];
    const d1lng = cur[0] - prev[0];
    const d2lng = next[0] - cur[0];
    // Reversal = dot product negative (going opposite direction)
    const dot = d1lat*d2lat + d1lng*d2lng;
    const mag1 = Math.sqrt(d1lat*d1lat + d1lng*d1lng);
    const mag2 = Math.sqrt(d2lat*d2lat + d2lng*d2lng);
    if(mag1 > 0 && mag2 > 0){
      const cos = dot / (mag1 * mag2);
      if(cos < -0.3) penalty += mag1 + mag2; // sharp reversal penalty
    }
  }
  return penalty;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function doPaste(btn){
  const ta=document.getElementById('paste-in');
  const orig=btn.textContent;
  const flash=(cls,txt)=>{btn.classList.add(cls);btn.textContent=txt;setTimeout(()=>{btn.classList.remove(cls);btn.textContent=orig;},1400);};
  if(!navigator.clipboard||!navigator.clipboard.readText){
    flash('err','✗ 浏览器不支持，长按粘贴');
    return;
  }
  navigator.clipboard.readText().then(text=>{
    if(!text){flash('err','剪贴板为空');return;}
    ta.value=text; // 覆盖
    ta.dispatchEvent(new Event('input',{bubbles:true}));
    flash('ok','✓ 已粘贴');
  }).catch(err=>{
    flash('err','✗ 拒绝授权');
    console.error('clipboard read failed:',err);
  });
}

// ─── 今日订单数据库 ─────────────────────────────────────────────
const DB_KEY='route_optimizer_db';
const DB_RETAIN_DAYS=30;

function todayKey(){
  // Local date in YYYY-MM-DD (uses browser local TZ — Winnipeg).
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

// Storage with localStorage primary + memory fallback (Safari Private/blocked cookies)
let _memDB=null;          // in-memory mirror, used when localStorage unavailable
let _storageMode=null;    // 'local' | 'memory' | null (untested)
let _storageWarned=false;

function _detectStorage(){
  if(_storageMode!==null) return _storageMode;
  try{
    const k='__rotest__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    _storageMode='local';
  }catch(e){
    _storageMode='memory';
    if(!_storageWarned){
      _storageWarned=true;
      console.warn('localStorage unavailable, using memory only:',e.message||e);
    }
  }
  return _storageMode;
}

function loadDB(){
  const mode=_detectStorage();
  if(mode==='memory') return _memDB||{};
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return {};
    return JSON.parse(raw)||{};
  }catch(e){
    console.error('DB load failed, falling back to memory:',e);
    _storageMode='memory';
    return _memDB||{};
  }
}

function saveDB(db){
  const mode=_detectStorage();
  _memDB=db; // always keep mem mirror so a later failover keeps data
  if(mode==='memory') return;
  try{
    localStorage.setItem(DB_KEY,JSON.stringify(db));
  }catch(e){
    console.error('DB save failed, falling back to memory:',e);
    _storageMode='memory';
  }
}

function pruneDB(db){
  // Drop buckets older than DB_RETAIN_DAYS.
  const cutoff=new Date();
  cutoff.setDate(cutoff.getDate()-DB_RETAIN_DAYS);
  const cutoffKey=cutoff.toISOString().slice(0,10);
  let pruned=0;
  for(const k of Object.keys(db)){
    if(k<cutoffKey){delete db[k];pruned++;}
  }
  return pruned;
}

// Sync current `parsed` array into today's bucket.
// Rules:
//   - new job: add as pending (DELIVER_ONLY -> pickup_status:done)
//   - existing job: only fill blank fields; never overwrite status
//   - existing job not in current paste: mark pickup_status+deliver_status = done
//   - if current paste has zero PICKUP/DELIVER lines -> NO-OP (guard)
function syncToDB(){
  // Collect job-level info from `parsed` (which the parser already builds).
  const incoming={};
  for(const p of parsed){
    if(!['PICKUP','DELIVER','DELIVER_ONLY'].includes(p.type)) continue;
    if(!p.job) continue;
    if(!incoming[p.job]) incoming[p.job]={pickup:null,deliver:null,deliverOnly:false};
    if(p.type==='PICKUP') incoming[p.job].pickup=p.addr;
    else if(p.type==='DELIVER') incoming[p.job].deliver=p.addr;
    else if(p.type==='DELIVER_ONLY'){incoming[p.job].deliver=p.addr;incoming[p.job].deliverOnly=true;}
  }
  const incomingJobs=Object.keys(incoming);
  if(incomingJobs.length===0){
    // 防护:空粘贴不动数据库
    renderToday();
    return;
  }

  const db=loadDB();
  pruneDB(db);
  const k=todayKey();
  if(!db[k]) db[k]={};
  const bucket=db[k];

  // Add or refresh existing
  for(const job of incomingJobs){
    const inc=incoming[job];
    if(!bucket[job]){
      bucket[job]={
        pickup_addr: inc.pickup||'',
        deliver_addr: inc.deliver||'',
        pickup_status: inc.deliverOnly?'done':'pending',
        deliver_status: 'pending',
        first_seen: new Date().toISOString(),
        _wasDeliverOnly: !!inc.deliverOnly,
      };
    } else {
      // Fill blank fields only
      if(!bucket[job].pickup_addr && inc.pickup) bucket[job].pickup_addr=inc.pickup;
      if(!bucket[job].deliver_addr && inc.deliver) bucket[job].deliver_addr=inc.deliver;
      // 重新出现 -> 强制 pending (Spoke 重激活语义)
      bucket[job].pickup_status = inc.deliverOnly ? 'done' : 'pending';
      bucket[job].deliver_status='pending';
      if(inc.deliverOnly) bucket[job]._wasDeliverOnly=true;
    }
  }

  // Diff: jobs in bucket but not in incoming -> mark fully done
  const incomingSet=new Set(incomingJobs);
  for(const job of Object.keys(bucket)){
    if(!incomingSet.has(job)){
      bucket[job].pickup_status='done';
      bucket[job].deliver_status='done';
    }
  }

  saveDB(db);
  renderToday();
}

function toggleJob(jobId){
  const db=loadDB();
  const k=todayKey();
  const bucket=db[k];
  if(!bucket||!bucket[jobId]) return;
  const r=bucket[jobId];
  const wasDone=r.pickup_status==='done' && r.deliver_status==='done';
  if(wasDone){
    // 标回进行中: deliver -> pending. 若是 DELIVER_ONLY 则 pickup 保持 done
    r.deliver_status='pending';
    if(!r._wasDeliverOnly) r.pickup_status='pending';
  } else {
    r.pickup_status='done';
    r.deliver_status='done';
  }
  saveDB(db);
  renderToday();
}

function renderToday(){
  const card=document.getElementById('today-card');
  const list=document.getElementById('today-list');
  const title=document.getElementById('today-title');
  const db=loadDB();
  const bucket=db[todayKey()]||{};
  const jobs=Object.entries(bucket);
  if(jobs.length===0){
    card.style.display='none';
    return;
  }
  card.style.display='block';
  // Sort: in-progress first, completed after; within each by first_seen
  const isDone=r=>r&&r.pickup_status==='done' && r.deliver_status==='done';
  jobs.sort((a,b)=>{
    const da=isDone(a[1])?1:0, db_=isDone(b[1])?1:0;
    if(da!==db_) return da-db_;
    return (a[1].first_seen||'').localeCompare(b[1].first_seen||'');
  });
  const doneCount=jobs.filter(([,r])=>isDone(r)).length;
  const warn=_storageMode==='memory'?'  ⚠ 浏览器拒绝持久化, 关闭页面后丢失':'';
  title.textContent=`今日订单 (${doneCount}/${jobs.length} 完成)${warn}`;

  list.innerHTML=jobs.map(([job,r])=>{
    const done=isDone(r);
    const status=done?'完成':'进行中';
    const cls=done?'done':'pending';
    const pickup=r.pickup_addr?`<b>取</b>: ${r.pickup_addr}`:'';
    const deliver=r.deliver_addr?`<b>送</b>: ${r.deliver_addr}`:'';
    const sep=pickup&&deliver?'<br>':'';
    return `<div class="today-job ${done?'done':''}">
      <div class="today-job-head">
        <span class="today-job-id">#${job}</span>
        <span class="today-job-status ${cls}">${status}</span>
        <button type="button" class="today-toggle ${cls}" onclick="toggleJob('${job}')" aria-label="切换状态">${done?'✓':'○'}</button>
      </div>
      <div class="today-job-addr">${pickup}${sep}${deliver}</div>
    </div>`;
  }).join('');
}

function clearToday(){
  if(!confirm('确认清空今日所有订单记录?')) return;
  const db=loadDB();
  delete db[todayKey()];
  saveDB(db);
  renderToday();
}

function exportToday(){
  const db=loadDB();
  const bucket=db[todayKey()]||{};
  const jobs=Object.entries(bucket);
  if(jobs.length===0){alert('今日无订单');return;}
  const lines=[`今日订单 ${todayKey()}`,''];
  for(const [job,r] of jobs){
    const status=r.pickup_status==='done'&&r.deliver_status==='done'?'✓ 完成':'○ 进行中';
    lines.push(`#${job}  ${status}`);
    if(r.pickup_addr) lines.push(`  取: ${r.pickup_addr}`);
    if(r.deliver_addr) lines.push(`  送: ${r.deliver_addr}`);
    lines.push('');
  }
  const txt=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板')).catch(()=>{
      // Fallback: show in prompt
      window.prompt('复制以下内容:',txt);
    });
  } else {
    window.prompt('复制以下内容:',txt);
  }
}

// Debounced auto-sync on textarea input.
let _pasteSyncTimer=null;
function onPasteInput(){
  clearTimeout(_pasteSyncTimer);
  _pasteSyncTimer=setTimeout(()=>{
    doParse();      // populates `parsed`
    syncToDB();     // syncs into DB + rerender
  },800);
}

// Initial render on page load.
window.addEventListener('DOMContentLoaded',()=>{
  // Prune old + render today's saved bucket
  const db=loadDB();
  if(pruneDB(db)>0) saveDB(db);
  renderToday();
});

function doParse(){
  const raw=document.getElementById('paste-in').value.trim();
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  parsed=[];
  const pickupJobs=new Set();
  for(const line of lines){
    const parts=line.split('|');
    if(parts.length<2)continue;
    const type=parts[0].trim().toUpperCase();
    if(type==='ORIGIN'){
      // Auto-fill origin input field
      const addr=parts.slice(1).join('|').trim();
      if(addr)document.getElementById('origin').value=addr;
    } else if(type==='HOME'){
      parsed.push({type:'HOME',job:null,addr:parts.slice(1).join('|').trim(),include:true});
    } else if(['PICKUP','DELIVER','DELIVER_ONLY'].includes(type)&&parts.length>=3){
      const job=parts[1].trim();
      const addr=parts.slice(2).join('|').trim();
      if(!addr)continue;
      parsed.push({type,job,addr,include:true});
      if(type==='PICKUP')pickupJobs.add(job);
    }
  }
  // DELIVER with no matching PICKUP -> DELIVER_ONLY (already in vehicle)
  parsed.forEach(p=>{
    if(p.type==='DELIVER'&&!pickupJobs.has(p.job))p.type='DELIVER_ONLY';
  });
  renderParsed();
}

function renderParsed(){
  const el=document.getElementById('parsed-out');
  if(!parsed.length){el.style.display='block';el.innerHTML='<div style="color:var(--red);font-size:11px">未识别到有效行</div>';return;}
  el.style.display='block';
  el.innerHTML=parsed.map((p,i)=>{
    const tc=p.type==='PICKUP'?'pickup':p.type==='DELIVER'?'deliver':p.type==='DELIVER_ONLY'?'deliver_only':'home';
    const label=p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':p.type==='DELIVER_ONLY'?'送件(车上)':'家';
    return `<div class="parsed-item">
      <span class="p-type ${tc}">${label}</span>
      <span class="p-job">${p.job||''}</span>
      <div style="flex:1"><div class="p-addr">${p.addr}</div></div>
      <label class="toggle" style="width:34px;height:20px;flex-shrink:0">
        <input type="checkbox" ${p.include?'checked':''} onchange="parsed[${i}].include=this.checked">
        <span class="knob"></span>
      </label>
    </div>`;
  }).join('');
}

async function geocode(addr){
  // Mapbox geocoding - much better accuracy for Winnipeg addresses
  const q = encodeURIComponent(addr);
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${q}.json?access_token=${MAPBOX}&country=CA&limit=1&proximity=-97.1384,49.8951`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('Geocode '+r.status);
  const d = await r.json();
  if(!d.features?.length) throw new Error('找不到: '+addr);
  return d.features[0].center; // [lng, lat]
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function setStatus(msg,cls=''){const e=document.getElementById('status');e.textContent=msg;e.className='status '+cls;}

// Build ORS body with capacity constraints + shuffled order for variety
function buildOrsBody(originC, homeC, shipments, jobs, shuffled){
  // shuffled: false=original, true=full shuffle, 'partial'=swap adjacent
  // Capacity = total number of shipments (each takes 1 unit)
  // This ensures ORS models load: pickup adds 1, delivery removes 1
  // Vehicle capacity = max items we can carry at once = total shipments
  // (conservative: allows carrying all at once, ORS will optimize)
  const capacity=shipments.length+jobs.length||1;
  const vehicle={
    id:1,
    profile:'driving-car',
    start:originC,
    capacity:[capacity]
  };
  if(homeC)vehicle.end=homeC;

  let orderedShipments, orderedJobs;
  if(shuffled==='partial'){
    orderedShipments=[...shipments];
    orderedJobs=[...jobs];
    const si=Math.floor(Math.random()*Math.max(orderedShipments.length-1,1));
    if(orderedShipments.length>1)[orderedShipments[si],orderedShipments[si+1]]=[orderedShipments[si+1],orderedShipments[si]];
  } else {
    orderedShipments=shuffled?shuffle(shipments):shipments;
    orderedJobs=shuffled?shuffle(jobs):jobs;
  }

  const body={vehicles:[vehicle]};

  if(orderedShipments.length){
    body.shipments=orderedShipments.map(s=>({
      id:s.id,
      pickup:{
        id:s.pid,
        location:s.pickupCoord,
        amount:[1]  // load +1 when picked up
      },
      delivery:{
        id:s.did,
        location:s.deliverCoord,
        amount:[1]  // unload -1 when delivered
      }
    }));
  }
  if(orderedJobs.length){
    body.jobs=orderedJobs.map(j=>({
      id:j.id,
      location:j.coord,
      amount:[0]  // deliver_only: already in vehicle, no capacity change
    }));
  }
  return body;
}

async function callORS(body){
  const r=await fetch('https://api.openrouteservice.org/optimization',{
    method:'POST',
    headers:{'Authorization':ORS,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('ORS: '+t.slice(0,150));}
  return r.json();
}

async function doRun(){
  if(!parsed.length)doParse();
  const active=parsed.filter(p=>p.include&&p.type!=='HOME');
  if(!active.length){setStatus('没有有效站点','error');return;}

  const originStr=document.getElementById('origin').value.trim();
  const homeStr=document.getElementById('home').value.trim();
  const fixHome=document.getElementById('fix-home').checked;
  const doOpt=document.getElementById('do-opt').checked;
  const btn=document.getElementById('btn-run');
  btn.disabled=true;
  document.getElementById('results').style.display='none';

  try{
    // Step 1: Geocode all addresses
    const allAddrs=[originStr,...active.map(p=>p.addr),...(fixHome?[homeStr]:[])];
    const coords=[];
    for(let i=0;i<allAddrs.length;i++){
      setStatus(`解析地址 ${i+1}/${allAddrs.length}…`,'loading');
      coords.push(await geocode(allAddrs[i]));
      await sleep(300);
    }
    const originC=coords[0];
    const homeC=fixHome?coords[coords.length-1]:null;
    const stopCoords=fixHome?coords.slice(1,-1):coords.slice(1);
    active.forEach((p,i)=>p._coord=stopCoords[i]);

    let orderedItems;

    if(doOpt&&active.length>1){
      // Step 2: ORS Matrix API - real driving durations between ALL points
      // allLocs: [origin, stop0, stop1, ..., home]
      const allLocs=[originC,...stopCoords,...(homeC?[homeC]:[])];
      setStatus('获取真实路网时间矩阵…','loading');
      const matRes=await fetch('https://api.openrouteservice.org/v2/matrix/driving-car',{
        method:'POST',
        headers:{'Authorization':ORS,'Content-Type':'application/json'},
        body:JSON.stringify({locations:allLocs,metrics:['duration']})
      });
      if(!matRes.ok){const t=await matRes.text();throw new Error('Matrix: '+t.slice(0,100));}
      const matData=await matRes.json();
      const durMatrix=matData.durations; // N×N real driving durations in seconds

      // Step 3: Build pickup->delivery constraint map
      // requiresPickup[i] = j means item[i] (delivery) requires item[j] (pickup) done first
      const requiresPickup={};
      active.forEach((p,i)=>{
        if(p.type==='DELIVER'){
          const pickupIdx=active.findIndex(q=>q.type==='PICKUP'&&q.job===p.job);
          if(pickupIdx>=0) requiresPickup[i]=pickupIdx;
        }
      });

      // Step 4a: Multi-start greedy + VND local search (2-opt + or-opt).
      const n=active.length;
      const homeMatIdx=fixHome?allLocs.length-1:0;
      const IMPROVE_EPS=0.1;

      function routeCost(order){
        let path=[0,...order.map(i=>i+1),...(fixHome?[homeMatIdx]:[])];
        let t=0;
        for(let k=0;k<path.length-1;k++) t+=durMatrix[path[k]][path[k+1]];
        return t;
      }

      function constraintOk(order){
        const seen=new Set();
        for(const i of order){
          if(requiresPickup[i]!==undefined&&!seen.has(requiresPickup[i])) return false;
          seen.add(i);
        }
        return true;
      }

      // Greedy NN starting from a chosen first station (firstIdx in [0..n-1]).
      // firstIdx === -1 means: pick the first station by NN from origin (free choice).
      function greedyFrom(firstIdx){
        const visited=new Array(n).fill(false);
        const order=[];
        let curMatIdx=0;
        if(firstIdx>=0){
          // Forced first: only valid if it has no pending pickup dependency.
          if(requiresPickup[firstIdx]!==undefined) return null;
          visited[firstIdx]=true;
          order.push(firstIdx);
          curMatIdx=firstIdx+1;
        }
        for(let step=order.length;step<n;step++){
          let best=-1,bestDur=Infinity;
          for(let i=0;i<n;i++){
            if(visited[i]) continue;
            if(requiresPickup[i]!==undefined&&!visited[requiresPickup[i]]) continue;
            const d=durMatrix[curMatIdx][i+1];
            if(d<bestDur){bestDur=d;best=i;}
          }
          if(best<0) break;
          visited[best]=true;
          order.push(best);
          curMatIdx=best+1;
        }
        return order.length===n?order:null;
      }

      // 2-opt: reverse sub-segments while constraint-feasible & cost improves.
      function twoOpt(order){
        let improved=true,iters=0;
        while(improved&&iters<50){
          improved=false; iters++;
          const baseCost=routeCost(order);
          for(let i=0;i<order.length-1;i++){
            for(let j=i+2;j<order.length;j++){
              const newOrder=[
                ...order.slice(0,i+1),
                ...order.slice(i+1,j+1).reverse(),
                ...order.slice(j+1)
              ];
              if(!constraintOk(newOrder)) continue;
              if(routeCost(newOrder)<baseCost-IMPROVE_EPS){
                order.splice(0,order.length,...newOrder);
                improved=true;
                break;
              }
            }
            if(improved) break;
          }
        }
        return order;
      }

      // or-opt: relocate a chain of length 1/2/3 to every other position.
      function orOpt(order){
        let improved=true,iters=0;
        while(improved&&iters<50){
          improved=false; iters++;
          const baseCost=routeCost(order);
          outer:
          for(let len=1;len<=3;len++){
            for(let i=0;i+len<=order.length;i++){
              const chain=order.slice(i,i+len);
              const rest=[...order.slice(0,i),...order.slice(i+len)];
              for(let j=0;j<=rest.length;j++){
                if(j===i) continue; // same place
                const cand=[...rest.slice(0,j),...chain,...rest.slice(j)];
                if(!constraintOk(cand)) continue;
                if(routeCost(cand)<baseCost-IMPROVE_EPS){
                  order.splice(0,order.length,...cand);
                  improved=true;
                  break outer;
                }
              }
            }
          }
        }
        return order;
      }

      // VND: alternate 2-opt and or-opt until neither improves in one round.
      function vnd(order){
        let rounds=0;
        while(rounds<10){
          rounds++;
          const c0=routeCost(order);
          twoOpt(order);
          orOpt(order);
          const c1=routeCost(order);
          if(c1>=c0-IMPROVE_EPS) break;
        }
        return order;
      }

      // Build seed list: -1 (free origin) + K nearest no-pickup stations.
      const eligibleFirst=[];
      for(let i=0;i<n;i++){
        if(requiresPickup[i]===undefined) eligibleFirst.push(i);
      }
      eligibleFirst.sort((a,b)=>durMatrix[0][a+1]-durMatrix[0][b+1]);
      const K=Math.min(eligibleFirst.length,Math.max(3,Math.min(n,6)));
      const seeds=[-1,...eligibleFirst.slice(0,K)];

      // Run VND on every seed, keep the best.
      let orderIdx=null;
      let bestCost=Infinity;
      for(const s of seeds){
        const o=greedyFrom(s);
        if(!o) continue;
        vnd(o);
        const c=routeCost(o);
        if(c<bestCost){bestCost=c;orderIdx=o;}
      }
      // Fallback (should be unreachable): if nothing produced a full route,
      // fall back to a single NN from origin to keep the pipeline alive.
      if(!orderIdx) orderIdx=greedyFrom(-1)||[];


      orderedItems=orderIdx.map(i=>active[i]);
      const finalCost=Math.round(routeCost(orderIdx)/60);
      document.getElementById('sim-info').innerHTML=
        `多起点贪心 + 2-opt + or-opt · 预计 <span>${finalCost}</span> 分钟`;

    } else {
      orderedItems=active;
      document.getElementById('sim-info').innerHTML='';
    }

    // Step 5: Get final driving stats for ordered route
    setStatus('计算驾驶距离…','loading');
    const routeCoords=[originC,...orderedItems.map(p=>p._coord),...(homeC?[homeC]:[])];
    let dist='—',time='—';
    try{
      const dr=await fetch('https://api.openrouteservice.org/v2/directions/driving-car',{
        method:'POST',
        headers:{'Authorization':ORS,'Content-Type':'application/json'},
        body:JSON.stringify({coordinates:routeCoords,preference:'shortest'})
      });
      if(dr.ok){const dd=await dr.json();const s=dd.routes?.[0]?.summary;
        if(s){dist=(s.distance/1000).toFixed(1);time=Math.round(s.duration/60);}}
    }catch(e){}

    document.getElementById('s-dist').textContent=dist;
    document.getElementById('s-time').textContent=time;
    document.getElementById('s-stops').textContent=orderedItems.length;

    // Render route
    const fullItems=[{addr:originStr,type:'ORIGIN',job:null},
      ...orderedItems,...(fixHome?[{addr:homeStr,type:'HOME',job:null}]:[])];
    document.getElementById('route-out').innerHTML=fullItems.map((p,i)=>{
      const isEdge=i===0||i===fullItems.length-1;
      const num=i===0?'&#9733;':i===fullItems.length-1?'&#8962;':i;
      const tc=p.type==='PICKUP'?'pickup':p.type==='DELIVER'?'deliver':
               p.type==='DELIVER_ONLY'?'deliver_only':'';
      const label=p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':
                  p.type==='DELIVER_ONLY'?'送件(车上)':'';
      const jobStr=p.job?` #${p.job}`:'';
      return `<div class="r-item">
        <div class="r-num ${isEdge?'sp':''}">${num}</div>
        <div class="r-body">
          ${tc?`<span class="r-tag ${tc}">${label}${jobStr}</span>`:''}
          <div class="r-addr">${p.addr}</div>
        </div>
      </div>`;
    }).join('');

    // Maps links — 相邻去重 (同一地址多单合并为一个 stop)
    // Google Maps 收到连续相同坐标会拒绝算路线 ("无法计算路线")。
    // 业务场景: 同一栋楼 N 单的取/送, 算法连排在一起, Maps 只需一个停靠点。
    const norm=s=>(s||'').trim().replace(/\s+/g,' ').toLowerCase();
    const rawList=fullItems.map(p=>p.addr);
    const addrList=rawList.filter((a,i)=>i===0||norm(a)!==norm(rawList[i-1]));
    const mapsEl=document.getElementById('maps-out');
    mapsEl.innerHTML='';
    const CHUNK=9; // Google Maps 官方上限: 总点数 10 (1 起点 + 9 后续)
    const totalSegs=Math.ceil(Math.max(addrList.length-1,1)/CHUNK);
    for(let i=0;i<addrList.length-1;i+=CHUNK){
      const seg=addrList.slice(i,Math.min(i+CHUNK+1,addrList.length));
      if(seg.length<2) continue; // 单点段没意义, 跳过
      const url='https://www.google.com/maps/dir/'+seg.map(a=>encodeURIComponent(a)).join('/');
      const sn=Math.floor(i/CHUNK)+1;
      const div=document.createElement('div');div.className='maps-seg';
      const dedupNote=addrList.length<rawList.length?` (合并 ${rawList.length-addrList.length} 个相同地址)`:'';
      div.innerHTML=`<div class="maps-lbl">${totalSegs>1?'段 '+sn+'/'+totalSegs:'完整路线'} · ${seg.length} 站${i===0?dedupNote:''}</div>
        <a href="${url}" target="_blank" class="maps-a">&#9654; 打开 Google Maps</a>`;
      mapsEl.appendChild(div);
    }

    document.getElementById('results').style.display='block';
    setStatus('✓ 完成','ok');

  }catch(e){setStatus('错误: '+e.message,'error');console.error(e);}
  finally{btn.disabled=false;}
}
</script>
