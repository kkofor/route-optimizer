<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Optimizer v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700&display=swap');
:root{
  --bg:#f5f3f0;--surface:#fff;--s2:#edeae5;--b:#ddd8d0;--b2:#c8c2b8;
  --green:#2d6a4f;--orange:#c8622a;--blue:#2a5cb8;--red:#c0392b;
  --text:#1c1c1c;--muted:#8a8278;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:14px;max-width:640px;margin:0 auto;}
h1{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--b);}
.card{background:var(--s1);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:10px;}
.card-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px;}
textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;outline:none;resize:vertical;min-height:180px;}
textarea:focus{border-color:var(--green);}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.6;}
.hint code{color:var(--orange);background:var(--s2);padding:1px 4px;border-radius:2px;}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;margin-bottom:8px;}
input[type=text]:focus{border-color:var(--green);}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.row label{font-size:12px;flex:1;}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.knob{position:absolute;inset:0;background:var(--b2);border-radius:10px;cursor:pointer;transition:background .2s;}
.knob:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#ccc;border-radius:50%;transition:transform .2s,background .2s;}
input:checked+.knob{background:var(--green);}
input:checked+.knob:before{transform:translateX(18px);background:#fff;}
.btn-parse{width:100%;background:none;border:1px dashed var(--b2);border-radius:4px;color:var(--muted);padding:9px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:8px;transition:all .2s;}
.btn-parse:hover{border-color:var(--green);color:var(--green);}
.btn-run{width:100%;background:var(--green);border:none;border-radius:6px;color:#fff;padding:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:8px;transition:opacity .2s;}
.btn-run:hover{opacity:.85;}
.btn-run:disabled{opacity:.3;cursor:not-allowed;}
.status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:6px;min-height:28px;}
.status.loading{color:var(--green);}
.status.error{color:var(--red);}
.status.ok{color:var(--green);}
.parsed-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);}
.parsed-item:last-child{border-bottom:none;}
.p-type{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 5px;border-radius:3px;flex-shrink:0;margin-top:2px;}
.p-type.pickup{background:#e6f4ed;color:var(--green);}
.p-type.deliver{background:#fdf0e6;color:var(--orange);}
.p-type.deliver_only{background:#e8eef8;color:var(--blue);}
.p-job{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);flex-shrink:0;margin-top:2px;width:60px;}
.p-addr{font-size:12px;line-height:1.4;}
.stats{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:10px;text-align:center;}
.stat-v{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--green);font-weight:700;}
.stat-l{font-size:9px;color:var(--muted);margin-top:2px;}
.sim-bar{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:4px;margin-bottom:8px;}
.sim-bar span{color:var(--green);}
.r-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--b);align-items:flex-start;}
.r-item:last-child{border-bottom:none;}
.r-num{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--green);color:#fff;width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.r-num.sp{background:var(--orange);}
.r-body{flex:1;}
.r-addr{font-size:12px;line-height:1.4;}
.r-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 5px;border-radius:2px;margin-right:4px;margin-bottom:3px;}
.r-tag.pickup{background:#e6f4ed;color:var(--green);}
.r-tag.deliver{background:#fdf0e6;color:var(--orange);}
.r-tag.deliver_only{background:#e8eef8;color:var(--blue);}
.maps-seg{margin-bottom:8px;}
.maps-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:3px;}
.maps-a{display:block;background:var(--s2);border:1px solid var(--b);border-radius:4px;color:var(--text);padding:10px 12px;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:11px;transition:border-color .2s;}
.maps-a:hover{border-color:var(--green);color:var(--green);}
</style>
</head>
<body>
<h1>&#9658;&#9658; Route Optimizer v3.2</h1>
<div class="card">
  <div class="card-title">① 粘贴 Claude 输出</div>
  <textarea id="paste-in" placeholder="PICKUP|2394568|1625 Kenaston Blvd, Winnipeg, MB R3P 2M4
DELIVER|2394568|101 Amber Trail, Winnipeg, MB R2P
DELIVER_ONLY|2393945|14 Wentwood Crescent, Winnipeg, MB R2P 2A8
HOME|16 Steeprock Cove, Winnipeg, MB R3Y 0L3"></textarea>
  <div class="hint">格式：<code>PICKUP|Job号|地址</code> / <code>DELIVER|Job号|地址</code> / <code>DELIVER_ONLY|任意|地址</code> / <code>HOME|地址</code></div>
  <button class="btn-parse" onclick="doParse()">解析 →</button>
  <div id="parsed-out" style="margin-top:10px;display:none"></div>
</div>
<div class="card">
  <div class="card-title">② 设置</div>
  <div class="row">
    <label>ORS 自动优化（多次模拟取最优）</label>
    <label class="toggle"><input type="checkbox" id="do-opt" checked><span class="knob"></span></label>
  </div>
  <div class="row" style="margin-bottom:10px">
    <label>终点固定为家</label>
    <label class="toggle"><input type="checkbox" id="fix-home" checked><span class="knob"></span></label>
  </div>
  <input type="text" id="origin" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="起点（当前位置）">
  <input type="text" id="home" value="16 Steeprock Cove, Winnipeg, MB R3Y 0L3" placeholder="家的地址" style="margin-bottom:0">
</div>
<button class="btn-run" id="btn-run" onclick="doRun()">&#9654; 优化并生成导航</button>
<div class="status" id="status"></div>
<div id="results" style="display:none">
  <div class="card">
    <div class="card-title">路线统计</div>
    <div class="sim-bar" id="sim-info"></div>
    <div class="stats">
      <div class="stat"><div class="stat-v" id="s-dist">—</div><div class="stat-l">km 驾驶</div></div>
      <div class="stat"><div class="stat-v" id="s-time">—</div><div class="stat-l">分钟</div></div>
      <div class="stat"><div class="stat-v" id="s-stops">—</div><div class="stat-l">站点</div></div>
    </div>
  </div>
  <div class="card"><div class="card-title">优化路线</div><div id="route-out"></div></div>
  <div class="card"><div class="card-title">Google Maps 导航</div><div id="maps-out"></div></div>
</div>
<script>
const ORS='eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImFjNzQxYjYwZmZhZTQ0NDliMGQ1NzFjM2MyN2NmMGQ4IiwiaCI6Im11cm11cjY0In0=';
const SIM_RUNS=15; // number of simulation runs
let parsed=[];


// ── Geo helpers ───────────────────────────────────────────────────
function dist2(a, b){
  const dx=a[0]-b[0], dy=a[1]-b[1];
  return dx*dx+dy*dy;
}

// Greedy nearest-neighbor pre-sort respecting shipment pickup-before-delivery
// coords: array of [lng,lat], items: corresponding item array
// Returns reordered [items, coords]
function nearestNeighborSort(originC, items, coords, shipments){
  const n = items.length;
  const visited = new Array(n).fill(false);
  const result = [], resultCoords = [];

  // Build set of delivery indices that require their pickup to be done first
  // pickupDone[deliveryIdx] = pickupIdx
  const requiresPickup = {}; // deliveryItemIndex -> pickupItemIndex
  shipments.forEach(s => {
    const pickupIdx = items.indexOf(s.pickupItem);
    const deliverIdx = items.indexOf(s.deliverItem);
    if(pickupIdx >= 0 && deliverIdx >= 0)
      requiresPickup[deliverIdx] = pickupIdx;
  });

  let cur = originC;
  for(let step = 0; step < n; step++){
    let best = -1, bestDist = Infinity;
    for(let i = 0; i < n; i++){
      if(visited[i]) continue;
      // Check pickup constraint: if this is a delivery, its pickup must be done
      if(requiresPickup[i] !== undefined){
        const pickupIdx = requiresPickup[i];
        if(!visited[pickupIdx]) continue; // skip - pickup not done yet
      }
      const d = dist2(cur, coords[i]);
      if(d < bestDist){ bestDist = d; best = i; }
    }
    if(best < 0) break;
    visited[best] = true;
    result.push(items[best]);
    resultCoords.push(coords[best]);
    cur = coords[best];
  }
  return [result, resultCoords];
}

// Score a route for backtracking: penalize direction reversals
// A "reversal" = moving north then south (or E/W equivalent) sharply
function backtrackScore(originC, orderedCoords, homeC){
  const allPts = [originC, ...orderedCoords, ...(homeC ? [homeC] : [])];
  let penalty = 0;
  for(let i = 1; i < allPts.length - 1; i++){
    const prev = allPts[i-1], cur = allPts[i], next = allPts[i+1];
    // Direction vectors
    const d1lat = cur[1] - prev[1];
    const d2lat = next[1] - cur[1];
    const d1lng = cur[0] - prev[0];
    const d2lng = next[0] - cur[0];
    // Reversal = dot product negative (going opposite direction)
    const dot = d1lat*d2lat + d1lng*d2lng;
    const mag1 = Math.sqrt(d1lat*d1lat + d1lng*d1lng);
    const mag2 = Math.sqrt(d2lat*d2lat + d2lng*d2lng);
    if(mag1 > 0 && mag2 > 0){
      const cos = dot / (mag1 * mag2);
      if(cos < -0.3) penalty += mag1 + mag2; // sharp reversal penalty
    }
  }
  return penalty;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function doParse(){
  const raw=document.getElementById('paste-in').value.trim();
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  parsed=[];
  const pickupJobs=new Set();
  for(const line of lines){
    const parts=line.split('|');
    if(parts.length<2)continue;
    const type=parts[0].trim().toUpperCase();
    if(type==='ORIGIN'){
      // Auto-fill origin input field
      const addr=parts.slice(1).join('|').trim();
      if(addr)document.getElementById('origin').value=addr;
    } else if(type==='HOME'){
      parsed.push({type:'HOME',job:null,addr:parts.slice(1).join('|').trim(),include:true});
    } else if(['PICKUP','DELIVER','DELIVER_ONLY'].includes(type)&&parts.length>=3){
      const job=parts[1].trim();
      const addr=parts.slice(2).join('|').trim();
      if(!addr)continue;
      parsed.push({type,job,addr,include:true});
      if(type==='PICKUP')pickupJobs.add(job);
    }
  }
  // DELIVER with no matching PICKUP -> DELIVER_ONLY (already in vehicle)
  parsed.forEach(p=>{
    if(p.type==='DELIVER'&&!pickupJobs.has(p.job))p.type='DELIVER_ONLY';
  });
  renderParsed();
}

function renderParsed(){
  const el=document.getElementById('parsed-out');
  if(!parsed.length){el.style.display='block';el.innerHTML='<div style="color:var(--red);font-size:11px">未识别到有效行</div>';return;}
  el.style.display='block';
  el.innerHTML=parsed.map((p,i)=>{
    const tc=p.type==='PICKUP'?'pickup':p.type==='DELIVER'?'deliver':p.type==='DELIVER_ONLY'?'deliver_only':'home';
    const label=p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':p.type==='DELIVER_ONLY'?'送件(车上)':'家';
    return `<div class="parsed-item">
      <span class="p-type ${tc}">${label}</span>
      <span class="p-job">${p.job||''}</span>
      <div style="flex:1"><div class="p-addr">${p.addr}</div></div>
      <label class="toggle" style="width:34px;height:20px;flex-shrink:0">
        <input type="checkbox" ${p.include?'checked':''} onchange="parsed[${i}].include=this.checked">
        <span class="knob"></span>
      </label>
    </div>`;
  }).join('');
}

async function geocode(addr){
  // Add Winnipeg bbox constraint + try multiple results to avoid city-center fallback
  const hasWpg=/winnipeg/i.test(addr);
  const hasMB=/\bMB\b/i.test(addr);
  const hasCA=/canada/i.test(addr);
  let q=addr;
  if(!hasWpg) q+=', Winnipeg';
  if(!hasMB) q+=', MB';
  if(!hasCA) q+=', Canada';
  // bbox: Winnipeg area only - prevents random city matches
  const url=`https://api.openrouteservice.org/geocode/search?api_key=${ORS}&text=${encodeURIComponent(q)}&boundary.country=CA&boundary.rect.min_lon=-97.45&boundary.rect.min_lat=49.70&boundary.rect.max_lon=-96.85&boundary.rect.max_lat=50.15&size=3`;
  const r=await fetch(url);
  if(!r.ok)throw new Error('Geocode '+r.status);
  const d=await r.json();
  if(!d.features?.length)throw new Error('找不到: '+addr);
  // Skip locality/region level results (city-center fallbacks), prefer street/address
  for(const f of d.features){
    const layer=f.properties.layer||'';
    if(layer!=='locality'&&layer!=='region'&&layer!=='country') return f.geometry.coordinates;
  }
  return d.features[0].geometry.coordinates;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function setStatus(msg,cls=''){const e=document.getElementById('status');e.textContent=msg;e.className='status '+cls;}

// Build ORS body with capacity constraints + shuffled order for variety
function buildOrsBody(originC, homeC, shipments, jobs, shuffled){
  // shuffled: false=original, true=full shuffle, 'partial'=swap adjacent
  // Capacity = total number of shipments (each takes 1 unit)
  // This ensures ORS models load: pickup adds 1, delivery removes 1
  // Vehicle capacity = max items we can carry at once = total shipments
  // (conservative: allows carrying all at once, ORS will optimize)
  const capacity=shipments.length+jobs.length||1;
  const vehicle={
    id:1,
    profile:'driving-car',
    start:originC,
    capacity:[capacity]
  };
  if(homeC)vehicle.end=homeC;

  let orderedShipments, orderedJobs;
  if(shuffled==='partial'){
    orderedShipments=[...shipments];
    orderedJobs=[...jobs];
    const si=Math.floor(Math.random()*Math.max(orderedShipments.length-1,1));
    if(orderedShipments.length>1)[orderedShipments[si],orderedShipments[si+1]]=[orderedShipments[si+1],orderedShipments[si]];
  } else {
    orderedShipments=shuffled?shuffle(shipments):shipments;
    orderedJobs=shuffled?shuffle(jobs):jobs;
  }

  const body={vehicles:[vehicle]};

  if(orderedShipments.length){
    body.shipments=orderedShipments.map(s=>({
      id:s.id,
      pickup:{
        id:s.pid,
        location:s.pickupCoord,
        amount:[1]  // load +1 when picked up
      },
      delivery:{
        id:s.did,
        location:s.deliverCoord,
        amount:[1]  // unload -1 when delivered
      }
    }));
  }
  if(orderedJobs.length){
    body.jobs=orderedJobs.map(j=>({
      id:j.id,
      location:j.coord,
      amount:[0]  // deliver_only: already in vehicle, no capacity change
    }));
  }
  return body;
}

async function callORS(body){
  const r=await fetch('https://api.openrouteservice.org/optimization',{
    method:'POST',
    headers:{'Authorization':ORS,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('ORS: '+t.slice(0,150));}
  return r.json();
}

async function doRun(){
  if(!parsed.length)doParse();
  const active=parsed.filter(p=>p.include&&p.type!=='HOME');
  if(!active.length){setStatus('没有有效站点','error');return;}

  const originStr=document.getElementById('origin').value.trim();
  const homeStr=document.getElementById('home').value.trim();
  const fixHome=document.getElementById('fix-home').checked;
  const doOpt=document.getElementById('do-opt').checked;
  const btn=document.getElementById('btn-run');
  btn.disabled=true;
  document.getElementById('results').style.display='none';

  try{
    // Step 1: Geocode all addresses
    const allAddrs=[originStr,...active.map(p=>p.addr),...(fixHome?[homeStr]:[])];
    const coords=[];
    for(let i=0;i<allAddrs.length;i++){
      setStatus(`解析地址 ${i+1}/${allAddrs.length}…`,'loading');
      coords.push(await geocode(allAddrs[i]));
      await sleep(300);
    }
    const originC=coords[0];
    const homeC=fixHome?coords[coords.length-1]:null;
    const stopCoords=fixHome?coords.slice(1,-1):coords.slice(1);
    active.forEach((p,i)=>p._coord=stopCoords[i]);

    let orderedItems;

    if(doOpt&&active.length>1){
      // Step 2: ORS Matrix API - real driving durations between ALL points
      // allLocs: [origin, stop0, stop1, ..., home]
      const allLocs=[originC,...stopCoords,...(homeC?[homeC]:[])];
      setStatus('获取真实路网时间矩阵…','loading');
      const matRes=await fetch('https://api.openrouteservice.org/v2/matrix/driving-car',{
        method:'POST',
        headers:{'Authorization':ORS,'Content-Type':'application/json'},
        body:JSON.stringify({locations:allLocs,metrics:['duration']})
      });
      if(!matRes.ok){const t=await matRes.text();throw new Error('Matrix: '+t.slice(0,100));}
      const matData=await matRes.json();
      const durMatrix=matData.durations; // N×N real driving durations in seconds

      // Step 3: Build pickup->delivery constraint map
      // requiresPickup[i] = j means item[i] (delivery) requires item[j] (pickup) done first
      const requiresPickup={};
      active.forEach((p,i)=>{
        if(p.type==='DELIVER'){
          const pickupIdx=active.findIndex(q=>q.type==='PICKUP'&&q.job===p.job);
          if(pickupIdx>=0) requiresPickup[i]=pickupIdx;
        }
      });

      // Step 4a: Greedy nearest-neighbor with real matrix + pickup constraint
      const n=active.length;
      const homeMatIdx=fixHome?allLocs.length-1:0;

      function routeCost(order){
        let path=[0,...order.map(i=>i+1),...(fixHome?[homeMatIdx]:[])];
        let t=0;
        for(let k=0;k<path.length-1;k++) t+=durMatrix[path[k]][path[k+1]];
        return t;
      }

      function constraintOk(order){
        const seen=new Set();
        for(const i of order){
          if(requiresPickup[i]!==undefined&&!seen.has(requiresPickup[i])) return false;
          seen.add(i);
        }
        return true;
      }

      const visited=new Array(n).fill(false);
      const orderIdx=[];
      let curMatIdx=0;

      for(let step=0;step<n;step++){
        let best=-1,bestDur=Infinity;
        for(let i=0;i<n;i++){
          if(visited[i]) continue;
          if(requiresPickup[i]!==undefined&&!visited[requiresPickup[i]]) continue;
          const d=durMatrix[curMatIdx][i+1];
          if(d<bestDur){bestDur=d;best=i;}
        }
        if(best<0) break;
        visited[best]=true;
        orderIdx.push(best);
        curMatIdx=best+1;
      }

      // Step 4b: 2-opt improvement - fix backtracking
      // Try reversing all sub-segments, keep if total cost improves
      let improved=true;
      let iters=0;
      while(improved&&iters<50){
        improved=false;
        iters++;
        for(let i=0;i<orderIdx.length-1;i++){
          for(let j=i+2;j<orderIdx.length;j++){
            // Reverse segment [i+1..j]
            const newOrder=[
              ...orderIdx.slice(0,i+1),
              ...orderIdx.slice(i+1,j+1).reverse(),
              ...orderIdx.slice(j+1)
            ];
            if(!constraintOk(newOrder)) continue;
            if(routeCost(newOrder)<routeCost(orderIdx)-0.1){
              orderIdx.splice(0,orderIdx.length,...newOrder);
              improved=true;
            }
          }
        }
      }

      orderedItems=orderIdx.map(i=>active[i]);
      const finalCost=Math.round(routeCost(orderIdx)/60);
      document.getElementById('sim-info').innerHTML=
        `真实路网矩阵 + 2-opt优化 · 预计 <span>${finalCost}</span> 分钟`;

    } else {
      orderedItems=active;
      document.getElementById('sim-info').innerHTML='';
    }

    // Step 5: Get final driving stats for ordered route
    setStatus('计算驾驶距离…','loading');
    const routeCoords=[originC,...orderedItems.map(p=>p._coord),...(homeC?[homeC]:[])];
    let dist='—',time='—';
    try{
      const dr=await fetch('https://api.openrouteservice.org/v2/directions/driving-car',{
        method:'POST',
        headers:{'Authorization':ORS,'Content-Type':'application/json'},
        body:JSON.stringify({coordinates:routeCoords,preference:'shortest'})
      });
      if(dr.ok){const dd=await dr.json();const s=dd.routes?.[0]?.summary;
        if(s){dist=(s.distance/1000).toFixed(1);time=Math.round(s.duration/60);}}
    }catch(e){}

    document.getElementById('s-dist').textContent=dist;
    document.getElementById('s-time').textContent=time;
    document.getElementById('s-stops').textContent=orderedItems.length;

    // Render route
    const fullItems=[{addr:originStr,type:'ORIGIN',job:null},
      ...orderedItems,...(fixHome?[{addr:homeStr,type:'HOME',job:null}]:[])];
    document.getElementById('route-out').innerHTML=fullItems.map((p,i)=>{
      const isEdge=i===0||i===fullItems.length-1;
      const num=i===0?'&#9733;':i===fullItems.length-1?'&#8962;':i;
      const tc=p.type==='PICKUP'?'pickup':p.type==='DELIVER'?'deliver':
               p.type==='DELIVER_ONLY'?'deliver_only':'';
      const label=p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':
                  p.type==='DELIVER_ONLY'?'送件(车上)':'';
      const jobStr=p.job?` #${p.job}`:'';
      return `<div class="r-item">
        <div class="r-num ${isEdge?'sp':''}">${num}</div>
        <div class="r-body">
          ${tc?`<span class="r-tag ${tc}">${label}${jobStr}</span>`:''}
          <div class="r-addr">${p.addr}</div>
        </div>
      </div>`;
    }).join('');

    // Maps links
    const addrList=fullItems.map(p=>p.addr);
    const mapsEl=document.getElementById('maps-out');
    mapsEl.innerHTML='';
    const CHUNK=9;
    const totalSegs=Math.ceil((addrList.length-1)/CHUNK);
    for(let i=0;i<addrList.length-1;i+=CHUNK){
      const seg=addrList.slice(i,Math.min(i+CHUNK+1,addrList.length));
      const url='https://www.google.com/maps/dir/'+seg.map(a=>encodeURIComponent(a)).join('/');
      const sn=Math.floor(i/CHUNK)+1;
      const div=document.createElement('div');div.className='maps-seg';
      div.innerHTML=`<div class="maps-lbl">${totalSegs>1?'段 '+sn+'/'+totalSegs:'完整路线'} · ${seg.length} 站</div>
        <a href="${url}" target="_blank" class="maps-a">&#9654; 打开 Google Maps</a>`;
      mapsEl.appendChild(div);
    }

    document.getElementById('results').style.display='block';
    setStatus('✓ 完成','ok');

  }catch(e){setStatus('错误: '+e.message,'error');console.error(e);}
  finally{btn.disabled=false;}
}
</script>
</body>
</html>
