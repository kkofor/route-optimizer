<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700&display=swap');
:root{
  --bg:#f5f3f0;--s1:#fff;--s2:#edeae5;--b:#ddd8d0;--b2:#c8c2b8;
  --green:#2d6a4f;--orange:#c8622a;--blue:#2a5cb8;--red:#c0392b;--yellow:#b8860b;
  --text:#1c1c1c;--muted:#8a8278;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:12px;max-width:680px;margin:0 auto;}

/* NAV */
.nav{display:flex;gap:4px;margin-bottom:14px;background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:4px;}
.nav-btn{flex:1;background:none;border:none;border-radius:6px;color:var(--muted);padding:9px 4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;transition:all .2s;}
.nav-btn.active{background:var(--green);color:#fff;font-weight:700;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:14px;margin-bottom:12px;}
.card-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:12px;}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--b2);border-radius:8px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:#eaf4ee;}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-icon{font-size:32px;margin-bottom:8px;}
.upload-label{font-size:13px;color:var(--muted);}
.upload-label span{color:var(--green);}
.preview-img{width:100%;max-height:220px;object-fit:contain;border-radius:6px;margin-top:10px;border:1px solid var(--b);}

/* BUTTONS */
.btn{border:none;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.06em;transition:opacity .2s;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn-green{background:var(--green);color:#fff;padding:12px;font-size:12px;width:100%;}
.btn-green:hover:not(:disabled){opacity:.85;}
.btn-outline{background:none;border:1px solid var(--b2);color:var(--muted);padding:9px 14px;font-size:11px;}
.btn-outline:hover:not(:disabled){border-color:var(--green);color:var(--green);}
.btn-small{padding:4px 10px;font-size:10px;border-radius:4px;}

/* STATUS */
.status-bar{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center;padding:8px;min-height:32px;border-radius:6px;}
.status-bar.idle{color:var(--muted);}
.status-bar.loading{color:var(--green);background:#eaf4ee;border:1px solid #b8d8c4;}
.status-bar.error{color:var(--red);background:#fdecea;border:1px solid #f2b8b8;}
.status-bar.ok{color:var(--green);}
.setup-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px;}
.setup-note code{font-family:'JetBrains Mono',monospace;background:var(--s2);padding:1px 4px;border-radius:3px;color:var(--text);}

/* ORDER LIST */
.order-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--b);}
.order-item:last-child{border-bottom:none;}
.o-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:2px;white-space:nowrap;}
.badge-pickup{background:#e6f4ed;color:var(--green);}
.badge-deliver{background:#fdf0e6;color:var(--orange);}
.badge-deliver-only{background:#e8eef8;color:var(--blue);}
.badge-done{background:#f0eeeb;color:var(--muted);text-decoration:line-through;}
.o-job{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);width:58px;flex-shrink:0;margin-top:2px;}
.o-addr{font-size:12px;flex:1;line-height:1.4;}
.o-actions{display:flex;gap:4px;flex-shrink:0;}
.btn-done{background:#e6f4ed;border:1px solid #b8d8c4;color:var(--green);padding:3px 8px;font-size:9px;border-radius:3px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.btn-done:hover{background:#d0ebd9;}
.btn-undo{background:#1a1a1a;border:1px solid var(--b2);color:var(--muted);padding:3px 8px;font-size:9px;border-radius:3px;cursor:pointer;font-family:'JetBrains Mono',monospace;}

/* ROUTE */
.r-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--b);align-items:flex-start;}
.r-item:last-child{border-bottom:none;}
.r-num{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--green);color:#fff;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.r-num.sp{background:var(--orange);}
.r-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 5px;border-radius:2px;margin-right:4px;margin-bottom:3px;}
.r-addr{font-size:12px;line-height:1.4;}

/* MAPS */
.maps-seg{margin-bottom:8px;}
.maps-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:3px;}
.maps-a{display:block;background:var(--s2);border:1px solid var(--b);border-radius:4px;color:var(--text);padding:10px 12px;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:11px;transition:border-color .2s;}
.maps-a:hover{border-color:var(--green);color:var(--green);}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-card{background:var(--s2);border:1px solid var(--b);border-radius:6px;padding:12px;}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--green);font-weight:700;}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.day-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b);font-size:12px;}
.day-row:last-child{border-bottom:none;}
.day-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:80px;flex-shrink:0;}
.day-bar-wrap{flex:1;height:6px;background:var(--b2);border-radius:3px;overflow:hidden;}
.day-bar{height:100%;background:var(--green);border-radius:3px;}
.day-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);width:30px;text-align:right;flex-shrink:0;}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.toggle-row label{font-size:12px;flex:1;}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.knob{position:absolute;inset:0;background:var(--b2);border-radius:10px;cursor:pointer;transition:background .2s;}
.knob:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#bbb;border-radius:50%;transition:transform .2s,background .2s;}
input:checked+.knob{background:var(--green);}
input:checked+.knob:before{transform:translateX(18px);background:#fff;}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;margin-bottom:8px;}
input[type=text]:focus{border-color:var(--green);}

.sim-info{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-bottom:8px;}
.sim-info span{color:var(--green);}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:20px;}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('scan',this)">&#128247; 扫描</button>
  <button class="nav-btn" onclick="showPage('route',this)">&#9654; 路线</button>
  <button class="nav-btn" onclick="showPage('orders',this)">&#128230; 订单</button>
  <button class="nav-btn" onclick="showPage('stats',this)">&#128200; 统计</button>
</nav>

<!-- PAGE: SCAN -->
<div id="page-scan" class="page active">
  <div class="card">
    <div class="card-title">Open Source Setup</div>
    <input type="text" id="cfg-ai-base" placeholder="AI Base URL, e.g. https://your-gateway.example.com" oninput="savePublicConfig()">
    <input type="text" id="cfg-ai-token" placeholder="AI API token" oninput="savePublicConfig()">
    <input type="text" id="cfg-ai-model" placeholder="AI model, e.g. claude-sonnet-4-5-20251001" oninput="savePublicConfig()">
    <input type="text" id="cfg-ors-key" placeholder="OpenRouteService API key" oninput="savePublicConfig()" style="margin-bottom:0">
    <div class="setup-note" id="setup-status">Fill in your own keys. Values are stored only in this browser via <code>localStorage</code>.</div>
  </div>
  <div class="card">
    <div class="card-title">上传截图 — AI 自动解析</div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" accept="image/*" id="img-input" multiple onchange="onImageSelected(event)">
      <div class="upload-icon">&#128247;</div>
      <div class="upload-label">点击选择截图（可多选）或 <span>拖拽到这里</span></div>
    </div>
    <div id="preview-grid" style="display:none;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="card-title">当前位置</div>
    <input type="text" id="current-loc" placeholder="输入门牌号或完整地址，如 14 或 99"
      oninput="smartLocMatch(this.value)" autocomplete="off">
    <div id="loc-suggestions" style="display:none;margin-top:4px;border:1px solid var(--b);border-radius:4px;overflow:hidden;"></div>
  </div>

  <button class="btn btn-green" id="btn-scan" onclick="doScan()" disabled>&#9654; AI 解析订单</button>
  <div class="status-bar idle" id="scan-status">等待上传截图</div>

  <div id="scan-result" style="display:none">
    <div class="card" style="margin-top:12px">
      <div class="card-title">解析结果 <span id="parsed-count" style="color:var(--green)"></span></div>
      <div id="parsed-list"></div>
    </div>
    <button class="btn btn-green" onclick="applyAndRoute()" style="margin-top:4px">确认并规划路线 &#9654;</button>
  </div>
</div>

<!-- PAGE: ROUTE -->
<div id="page-route" class="page">
  <div class="card">
    <div class="card-title">路线设置</div>
    <div class="toggle-row">
      <label>ORS 自动优化（多次模拟）</label>
      <label class="toggle"><input type="checkbox" id="do-opt" checked><span class="knob"></span></label>
    </div>
    <div class="toggle-row" style="margin-bottom:10px">
      <label>终点固定为家</label>
      <label class="toggle"><input type="checkbox" id="fix-home" checked><span class="knob"></span></label>
    </div>
    <input type="text" id="route-origin" placeholder="起点" value="123 Example St, Winnipeg, MB" oninput="saveAddressDefaults()">
    <input type="text" id="route-home" placeholder="家的地址" value="123 Example St, Winnipeg, MB" style="margin-bottom:0" oninput="saveAddressDefaults()">
  </div>
  <button class="btn btn-green" id="btn-route" onclick="doRoute()">&#9654; 优化路线</button>
  <div class="status-bar idle" id="route-status"></div>

  <div id="route-result" style="display:none">
    <div class="card" style="margin-top:12px">
      <div class="card-title">路线统计</div>
      <div class="sim-info" id="sim-info"></div>
      <div style="display:flex;gap:8px">
        <div class="stat-card" style="flex:1"><div class="stat-val" id="r-dist">—</div><div class="stat-lbl">km</div></div>
        <div class="stat-card" style="flex:1"><div class="stat-val" id="r-time">—</div><div class="stat-lbl">分钟</div></div>
        <div class="stat-card" style="flex:1"><div class="stat-val" id="r-stops">—</div><div class="stat-lbl">站点</div></div>
      </div>
    </div>
    <div class="card"><div class="card-title">优化顺序</div><div id="route-list"></div></div>
    <div class="card"><div class="card-title">Google Maps 导航</div><div id="maps-list"></div></div>
  </div>
</div>

<!-- PAGE: ORDERS -->
<div id="page-orders" class="page">
  <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)" id="orders-date"></div>
    <div style="flex:1"></div>
    <button class="btn btn-outline btn-small" onclick="clearTodayOrders()">清空今日</button>
  </div>
  <div class="card">
    <div class="card-title">今日订单</div>
    <div id="orders-list"><div class="empty">暂无订单，请先扫描截图</div></div>
  </div>
</div>

<!-- PAGE: STATS -->
<div id="page-stats" class="page">
  <div class="card">
    <div class="card-title">今日概览</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val" id="st-today">0</div><div class="stat-lbl">今日完成</div></div>
      <div class="stat-card"><div class="stat-val" id="st-pending">0</div><div class="stat-lbl">待送</div></div>
      <div class="stat-card"><div class="stat-val" id="st-km">—</div><div class="stat-lbl">今日里程 km</div></div>
      <div class="stat-card"><div class="stat-val" id="st-total">0</div><div class="stat-lbl">累计完成</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">历史记录（近7天）</div>
    <div id="history-list"><div class="empty">暂无历史数据</div></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────
const PUBLIC_CONFIG_KEY = 'dispatch_pro_public_config_v1';
const ADDRESS_CONFIG_KEY = 'dispatch_pro_address_defaults_v1';
const DEFAULT_AI_MODEL = 'claude-sonnet-4-5-20251001';
const SIM_RUNS = 15;
const STORAGE_KEY = 'dispatch_db';

// ── State ─────────────────────────────────────────────────────────
let db = loadDB();
let currentImages = []; // array of {data, mediaType}
let pendingOrders = []; // parsed from scan, awaiting confirmation
let routeOrderedItems = [];

// ── DB ────────────────────────────────────────────────────────────
function loadDB(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }
  catch(e){ return {}; }
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

function loadPublicConfig(){
  try{ return JSON.parse(localStorage.getItem(PUBLIC_CONFIG_KEY)||'{}'); }
  catch(e){ return {}; }
}

function getPublicConfig(){
  const cfg = loadPublicConfig();
  return {
    aiBase: (cfg.aiBase || '').trim().replace(/\/+$/,''),
    aiToken: (cfg.aiToken || '').trim(),
    aiModel: (cfg.aiModel || '').trim() || DEFAULT_AI_MODEL,
    orsKey: (cfg.orsKey || '').trim()
  };
}

function savePublicConfig(){
  localStorage.setItem(PUBLIC_CONFIG_KEY, JSON.stringify({
    aiBase: document.getElementById('cfg-ai-base').value.trim(),
    aiToken: document.getElementById('cfg-ai-token').value.trim(),
    aiModel: document.getElementById('cfg-ai-model').value.trim(),
    orsKey: document.getElementById('cfg-ors-key').value.trim()
  }));
  renderSetupStatus();
}

function fillPublicConfig(){
  const cfg = getPublicConfig();
  document.getElementById('cfg-ai-base').value = cfg.aiBase;
  document.getElementById('cfg-ai-token').value = cfg.aiToken;
  document.getElementById('cfg-ai-model').value = cfg.aiModel;
  document.getElementById('cfg-ors-key').value = cfg.orsKey;
}

function renderSetupStatus(){
  const cfg = getPublicConfig();
  const missing = [];
  if(!cfg.aiBase) missing.push('AI base');
  if(!cfg.aiToken) missing.push('AI token');
  if(!cfg.orsKey) missing.push('ORS key');
  const el = document.getElementById('setup-status');
  el.textContent = missing.length
    ? `Missing: ${missing.join(', ')}. Values are stored only in this browser via localStorage.`
    : 'Ready: AI base, AI token, ORS key. Values are stored only in this browser via localStorage.';
}

function requirePublicConfig(parts){
  const cfg = getPublicConfig();
  const labels = {
    aiBase: 'AI Base URL',
    aiToken: 'AI API token',
    aiModel: 'AI model',
    orsKey: 'OpenRouteService key'
  };
  const missing = parts.filter(part => !cfg[part]);
  if(missing.length) throw new Error(`请先在 Open Source Setup 填写 ${missing.map(k=>labels[k]).join('、')}`);
  return cfg;
}

function loadAddressDefaults(){
  try{ return JSON.parse(localStorage.getItem(ADDRESS_CONFIG_KEY)||'{}'); }
  catch(e){ return {}; }
}

function applyAddressDefaults(){
  const saved = loadAddressDefaults();
  if(saved.routeOrigin) document.getElementById('route-origin').value = saved.routeOrigin;
  if(saved.routeHome) document.getElementById('route-home').value = saved.routeHome;
}

function saveAddressDefaults(){
  localStorage.setItem(ADDRESS_CONFIG_KEY, JSON.stringify({
    routeOrigin: document.getElementById('route-origin').value.trim(),
    routeHome: document.getElementById('route-home').value.trim()
  }));
}

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function getTodayRecord(){
  const k = todayKey();
  if(!db[k]) db[k] = {jobs:{}, km:0, completedCount:0};
  return db[k];
}


// ── Nav ───────────────────────────────────────────────────────────
function showPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(el) el.classList.add('active');
  if(name==='orders') renderOrders();
  if(name==='stats') renderStats();
}

// ── Image upload ──────────────────────────────────────────────────
function onImageSelected(e){
  const files = Array.from(e.target.files);
  if(!files.length) return;
  currentImages = [];
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = '';
  grid.style.display = 'flex';
  let loaded = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const header = ev.target.result.split(',')[0];
      const mediaType = header.match(/:(.*?);/)?.[1] || 'image/jpeg';
      const data = ev.target.result.split(',')[1];
      currentImages[i] = {data, mediaType};
      // Preview thumbnail
      const img = document.createElement('img');
      img.src = ev.target.result;
      img.style.cssText = 'height:80px;border-radius:4px;border:1px solid var(--b);object-fit:cover;flex:1;min-width:60px;max-width:120px;';
      grid.appendChild(img);
      loaded++;
      if(loaded === files.length){
        document.getElementById('btn-scan').disabled = false;
        setStatus('scan', `${files.length} 张截图已加载，点击解析`, 'idle');
      }
    };
    reader.readAsDataURL(file);
  });
}

// Drag and drop
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', ()=>zone.classList.remove('drag'));
zone.addEventListener('drop', e=>{
  e.preventDefault(); zone.classList.remove('drag');
  if(e.dataTransfer.files.length){
    document.getElementById('img-input').files = e.dataTransfer.files;
    onImageSelected({target:{files:e.dataTransfer.files}});
  }
});

// ── AI Scan ───────────────────────────────────────────────────────
async function doScan(){
  if(!currentImages.length){ setStatus('scan','请先上传截图','error'); return; }
  const cfg = requirePublicConfig(['aiBase','aiToken']);
  document.getElementById('btn-scan').disabled = true;
  setStatus('scan', 'AI 解析中…', 'loading');
  document.getElementById('scan-result').style.display = 'none';

  const today = getTodayRecord();
  const doneJobs = Object.entries(today.jobs)
    .filter(([,v])=>v.pickup==='done')
    .map(([k])=>k);

  const prompt = `你是一个配送订单解析助手。分析这张配送app截图，提取所有订单信息。

已知今日已完成取件的Job号: ${doneJobs.length ? doneJobs.join(', ') : '无'}

请按以下规则输出，每行一条，只输出这些行，不要其他文字：
- 有取件地址且取件未完成: PICKUP|Job号|完整地址
- 有送件地址且取件已完成(在上面已完成列表里): DELIVER_ONLY|Job号|完整地址  
- 有取件且有对应送件: 分两行，PICKUP和DELIVER各一行
- 送件地址: DELIVER|Job号|完整地址

地址格式要完整，包含门牌号、街道、城市、省份、邮编。
只输出数据行，不要解释。`;

  try{
    // Build content array: all images + prompt text
    const msgContent = currentImages.map(img => ({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.data }
    }));
    msgContent.push({ type: 'text', text: prompt });

    const res = await fetch(`${cfg.aiBase}/v1/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': cfg.aiToken,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: cfg.aiModel,
        max_tokens: 1500,
        messages: [{ role: 'user', content: msgContent }]
      })
    });

    if(!res.ok){ const t=await res.text(); throw new Error('AI: '+t.slice(0,100)); }
    const data = await res.json();
    const text = data.content[0].text.trim();

    // Parse response
    pendingOrders = [];
    const pickupJobs = new Set();
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    for(const line of lines){
      const parts = line.split('|');
      if(parts.length < 3) continue;
      const type = parts[0].toUpperCase();
      if(!['PICKUP','DELIVER','DELIVER_ONLY'].includes(type)) continue;
      const job = parts[1].trim();
      const addr = parts.slice(2).join('|').trim();
      if(!addr) continue;
      pendingOrders.push({type, job, addr});
      if(type==='PICKUP') pickupJobs.add(job);
    }
    // Fix: DELIVER with no matching PICKUP in this scan -> DELIVER_ONLY (already in vehicle)
    pendingOrders.forEach(p=>{
      if(p.type==='DELIVER' && !pickupJobs.has(p.job))
        p.type='DELIVER_ONLY';
    });

    if(!pendingOrders.length){ setStatus('scan','未识别到订单，请检查截图','error'); return; }

    // Auto-fill current location
    const locInput = document.getElementById('current-loc').value.trim();
    if(locInput) document.getElementById('route-origin').value = locInput;
    // Re-run smart match with new addresses loaded
    smartLocMatch(locInput);

    renderParsedOrders();
    document.getElementById('scan-result').style.display = 'block';
    document.getElementById('parsed-count').textContent = pendingOrders.length + ' 条';
    setStatus('scan', `识别到 ${pendingOrders.length} 条订单`, 'ok');

  }catch(e){
    setStatus('scan', '错误: '+e.message, 'error');
    console.error(e);
  } finally {
    document.getElementById('btn-scan').disabled = false;
  }
}

function renderParsedOrders(){

  const rec = getTodayRecord();
  el.innerHTML = pendingOrders.map((p,i)=>{
    const tc = p.type==='PICKUP'?'badge-pickup':p.type==='DELIVER'?'badge-deliver':'badge-deliver-only';
    const label = p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':'送件(车上)';

    );
    const newTag = !isExisting ? '<span style="font-family:JetBrains Mono,monospace;font-size:9px;color:#000;background:var(--green);padding:1px 5px;border-radius:2px;margin-left:4px">NEW</span>' : '';
    const doneTag = isDone ? '<span style="font-family:JetBrains Mono,monospace;font-size:9px;color:var(--muted);padding:1px 5px;border-radius:2px;margin-left:4px;background:var(--b2)">已完成</span>' : '';

  }).join('');
}

// ── Smart location match ─────────────────────────────────────────
function smartLocMatch(val){
  const sug = document.getElementById('loc-suggestions');
  val = val.trim();
  if(!val || val.length < 1){ sug.style.display='none'; return; }

  // Collect all known addresses from today's DB
  const rec = getTodayRecord();
  const candidates = [];
  Object.values(rec.jobs).forEach(job => {
    if(job.addr_pickup) candidates.push(job.addr_pickup);
    if(job.addr_deliver) candidates.push(job.addr_deliver);
  });
  // Also add home
  candidates.push(document.getElementById('route-home').value);

  // If pure number: match by street number prefix
  const isNum = /^\d+$/.test(val);
  const matches = candidates.filter(addr => {
    if(!addr) return false;
    if(isNum){
      // Match if address starts with this number
      const addrNum = addr.match(/^(\d+)/);
      return addrNum && addrNum[1] === val;
    } else {
      // Partial string match (case insensitive)
      return addr.toLowerCase().includes(val.toLowerCase());
    }
  });

  // Deduplicate
  const unique = [...new Set(matches)];

  if(!unique.length){ sug.style.display='none'; return; }

  sug.style.display = 'block';
  sug.innerHTML = unique.map(addr =>
    `<div onclick="selectLoc('${addr.replace(/'/g,"\'")}')"
      style="padding:9px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--b);background:var(--surface);transition:background .15s;"
      onmouseover="this.style.background='var(--s2)'"
      onmouseout="this.style.background='var(--surface)'"
    >${addr}</div>`
  ).join('');
}

function selectLoc(addr){
  document.getElementById('current-loc').value = addr;

  document.getElementById('route-origin').value = addr;
}

function applyAndRoute(){
  const rec = getTodayRecord();
  pendingOrders.forEach(p=>{
    const existing = rec.jobs[p.job];
    if(!existing){
      // Brand new job - init fresh
      rec.jobs[p.job]={pickup:'pending',deliver:'pending',addr_pickup:'',addr_deliver:''};
    }
    // Always update address if empty (fill in missing info)
    // But NEVER touch status fields of existing jobs - preserve done/pending state
    if(p.type==='PICKUP'){
      if(!rec.jobs[p.job].addr_pickup) rec.jobs[p.job].addr_pickup=p.addr;
    }
    if(p.type==='DELIVER'||p.type==='DELIVER_ONLY'){
      if(!rec.jobs[p.job].addr_deliver) rec.jobs[p.job].addr_deliver=p.addr;
    }
    // Only mark pickup done if this is a new job (existing jobs keep their status)
    if(p.type==='DELIVER_ONLY' && !existing){
      rec.jobs[p.job].pickup='done';
    }
  });
  saveDB();

  // Switch to route page
  showPageDirect('route');
  doRoute();
}

// ── Geo helpers ───────────────────────────────────────────────────
function dist2(a, b){
  const dx=a[0]-b[0], dy=a[1]-b[1];
  return dx*dx+dy*dy;
}

// Greedy nearest-neighbor pre-sort respecting shipment pickup-before-delivery
// coords: array of [lng,lat], items: corresponding item array
// Returns reordered [items, coords]
function nearestNeighborSort(originC, items, coords, shipments){
  const n = items.length;
  const visited = new Array(n).fill(false);
  const result = [], resultCoords = [];

  // Build set of delivery indices that require their pickup to be done first
  // pickupDone[deliveryIdx] = pickupIdx
  const requiresPickup = {}; // deliveryItemIndex -> pickupItemIndex
  shipments.forEach(s => {
    const pickupIdx = items.indexOf(s.pickupItem);
    const deliverIdx = items.indexOf(s.deliverItem);
    if(pickupIdx >= 0 && deliverIdx >= 0)
      requiresPickup[deliverIdx] = pickupIdx;
  });

  let cur = originC;
  for(let step = 0; step < n; step++){
    let best = -1, bestDist = Infinity;
    for(let i = 0; i < n; i++){
      if(visited[i]) continue;
      // Check pickup constraint: if this is a delivery, its pickup must be done
      if(requiresPickup[i] !== undefined){
        const pickupIdx = requiresPickup[i];
        if(!visited[pickupIdx]) continue; // skip - pickup not done yet
      }
      const d = dist2(cur, coords[i]);
      if(d < bestDist){ bestDist = d; best = i; }
    }
    if(best < 0) break;
    visited[best] = true;
    result.push(items[best]);
    resultCoords.push(coords[best]);
    cur = coords[best];
  }
  return [result, resultCoords];
}

// Score a route for backtracking: penalize direction reversals
// A "reversal" = moving north then south (or E/W equivalent) sharply
function backtrackScore(originC, orderedCoords, homeC){
  const allPts = [originC, ...orderedCoords, ...(homeC ? [homeC] : [])];
  let penalty = 0;
  for(let i = 1; i < allPts.length - 1; i++){
    const prev = allPts[i-1], cur = allPts[i], next = allPts[i+1];
    // Direction vectors
    const d1lat = cur[1] - prev[1];
    const d2lat = next[1] - cur[1];
    const d1lng = cur[0] - prev[0];
    const d2lng = next[0] - cur[0];
    // Reversal = dot product negative (going opposite direction)
    const dot = d1lat*d2lat + d1lng*d2lng;
    const mag1 = Math.sqrt(d1lat*d1lat + d1lng*d1lng);
    const mag2 = Math.sqrt(d2lat*d2lat + d2lng*d2lng);
    if(mag1 > 0 && mag2 > 0){
      const cos = dot / (mag1 * mag2);
      if(cos < -0.3) penalty += mag1 + mag2; // sharp reversal penalty
    }
  }
  return penalty;
}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function setStatus(page, msg, cls){ const e=document.getElementById(page+'-status'); if(e){e.textContent=msg; e.className='status-bar '+(cls||'idle');} }

async function geocode(addr){
  const cfg = requirePublicConfig(['orsKey']);
  const q = addr+(!/winnipeg/i.test(addr)?', Winnipeg, MB':'')+(!/canada/i.test(addr)?', Canada':'');
  const r = await fetch(`https://api.openrouteservice.org/geocode/search?api_key=${cfg.orsKey}&text=${encodeURIComponent(q)}&boundary.country=CA&size=1`);
  if(!r.ok) throw new Error('Geocode '+r.status);
  const d = await r.json();
  if(!d.features?.length) throw new Error('找不到: '+addr);
  return d.features[0].geometry.coordinates;
}

async function doRoute(){
  const cfg = requirePublicConfig(['orsKey']);
  const rec = getTodayRecord();
  const originStr = document.getElementById('route-origin').value.trim() || '123 Example St, Winnipeg, MB';
  const homeStr = document.getElementById('route-home').value.trim();
  const fixHome = document.getElementById('fix-home').checked;
  const doOpt = document.getElementById('do-opt').checked;

  // Build active stops from DB (pending orders only)
  const active = [];
  Object.entries(rec.jobs).forEach(([jobId, job])=>{
    if(job.pickup==='pending' && job.addr_pickup)
      active.push({type:'PICKUP', job:jobId, addr:job.addr_pickup});
    if(job.deliver==='pending' && job.addr_deliver){
      const t = job.pickup==='done' ? 'DELIVER_ONLY' : 'DELIVER';
      active.push({type:t, job:jobId, addr:job.addr_deliver});
    }
  });

  if(!active.length){ setStatus('route','没有待处理订单','error'); return; }

  document.getElementById('btn-route').disabled = true;
  document.getElementById('route-result').style.display = 'none';

  try{
    const allAddrs = [originStr, ...active.map(p=>p.addr), ...(fixHome?[homeStr]:[])];
    const coords = [];
    for(let i=0;i<allAddrs.length;i++){
      setStatus('route',`解析地址 ${i+1}/${allAddrs.length}…`,'loading');
      coords.push(await geocode(allAddrs[i]));
      await sleep(300);
    }
    const originC = coords[0];
    const homeC = fixHome ? coords[coords.length-1] : null;
    const stopCoords = fixHome ? coords.slice(1,-1) : coords.slice(1);
    active.forEach((p,i)=>p._coord=stopCoords[i]);

    let orderedItems;

    if(doOpt && active.length>1){
      // Build shipments & jobs
      const byJob = {};
      active.forEach(p=>{
        if(p.type==='PICKUP'||p.type==='DELIVER'){
          if(!byJob[p.job]) byJob[p.job]={};
          byJob[p.job][p.type]=p;
        }
      });
      const shipments=[], jobs=[];
      let sIdx=0, jIdx=1000;
      Object.entries(byJob).forEach(([job,pair])=>{
        if(pair.PICKUP&&pair.DELIVER){
          const pid=sIdx*2+1, did=sIdx*2+2;
          shipments.push({id:sIdx+1,pid,did,pickupCoord:pair.PICKUP._coord,deliverCoord:pair.DELIVER._coord,pickupItem:pair.PICKUP,deliverItem:pair.DELIVER});
          sIdx++;
        }
      });
      active.forEach(p=>{ if(p.type==='DELIVER_ONLY') jobs.push({id:jIdx++,coord:p._coord,item:p}); });

      const idToItem={};
      shipments.forEach(s=>{idToItem[s.pid]=s.pickupItem;idToItem[s.did]=s.deliverItem;});
      jobs.forEach(j=>idToItem[j.id]=j.item);

      const cap = shipments.length||1; // max items in vehicle at once = number of paired shipments
      // Step 1: greedy nearest-neighbor pre-sort (respects pickup constraints)
      const allStopCoords = active.map(p=>p._coord);
      const [nnItems, nnCoords] = nearestNeighborSort(originC, active, allStopCoords, shipments);

      // Rebuild shipments/jobs arrays in NN order for first run
      const nnShipments = shipments; // ORS handles constraint, order hint via input sequence
      const nnJobs = jobs;

      let bestItems=null, bestCost=Infinity;
      const runs = SIM_RUNS;

      for(let run=0;run<runs;run++){
        setStatus('route',`模拟路线 ${run+1}/${runs}…`,'loading');

        // Run 0: NN-sorted order (best starting point)
        // Run 1-4: shuffle for variety
        // Run 5+: partial shuffles biased toward NN order
        let ordS, ordJ;
        if(run === 0){
          // Pure NN order
          ordS = nnShipments;
          ordJ = nnJobs;
        } else if(run < 5){
          ordS = shuffle(shipments);
          ordJ = shuffle(jobs);
        } else {
          // Partial shuffle: only swap adjacent pairs
          ordS = [...nnShipments];
          ordJ = [...nnJobs];
          const swapIdx = Math.floor(Math.random() * Math.max(ordS.length-1,1));
          if(ordS.length > 1)[ordS[swapIdx], ordS[swapIdx+1]] = [ordS[swapIdx+1], ordS[swapIdx]];
        }

        const vehicle={id:1,profile:'driving-car',start:originC,capacity:[cap]};
        if(homeC) vehicle.end=homeC;
        const body={vehicles:[vehicle]};
        if(ordS.length) body.shipments=ordS.map(s=>({id:s.id,pickup:{id:s.pid,location:s.pickupCoord,amount:[1]},delivery:{id:s.did,location:s.deliverCoord,amount:[1]}}));
        if(ordJ.length) body.jobs=ordJ.map(j=>({id:j.id,location:j.coord,amount:[0]}));
        await sleep(300);
        try{
          const r=await fetch('https://api.openrouteservice.org/optimization',{method:'POST',headers:{'Authorization':cfg.orsKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
          if(!r.ok) continue;
          const data=await r.json();
          const orsDist=data.routes[0].summary?.distance||data.routes[0].cost||Infinity;
          const steps=data.routes[0].steps.filter(s=>s.type==='pickup'||s.type==='delivery'||s.type==='job');
          const items=steps.map(st=>idToItem[st.id]).filter(Boolean);
          // Combined cost = ORS distance + backtrack penalty (weighted)
          const coords=items.map(p=>p._coord);
          const btPenalty = backtrackScore(originC, coords, homeC);
          // Convert backtrack penalty to same scale as distance (degrees -> meters approx)
          const totalCost = orsDist + btPenalty * 111000 * 0.5;
          if(totalCost<bestCost){
            bestCost=totalCost;
            bestItems=items;
          }
        }catch(e){ console.warn('sim',run,'failed',e); }
      }
      if(!bestItems?.length) throw new Error('路线优化失败');
      orderedItems=bestItems;
      document.getElementById('sim-info').innerHTML=`已完成 <span>${runs}</span> 次模拟，采用最短路线`;
    } else {
      orderedItems=active;
      document.getElementById('sim-info').innerHTML='';
    }

    // Driving stats
    setStatus('route','计算驾驶距离…','loading');
    const routeCoords=[originC,...orderedItems.map(p=>p._coord),...(homeC?[homeC]:[])];
    let dist='—',time='—';
    try{
      const dr=await fetch('https://api.openrouteservice.org/v2/directions/driving-car',{method:'POST',headers:{'Authorization':cfg.orsKey,'Content-Type':'application/json'},body:JSON.stringify({coordinates:routeCoords,preference:'shortest'})});
      if(dr.ok){const dd=await dr.json();const s=dd.routes?.[0]?.summary;if(s){dist=(s.distance/1000).toFixed(1);time=Math.round(s.duration/60);}}
    }catch(e){}

    // Save km to DB
    if(dist!=='—'){ rec.km=parseFloat(dist); saveDB(); }

    document.getElementById('r-dist').textContent=dist;
    document.getElementById('r-time').textContent=time;
    document.getElementById('r-stops').textContent=orderedItems.length;

    // Render route list
    routeOrderedItems = orderedItems;
    const fullItems=[{addr:originStr,type:'ORIGIN',job:null},...orderedItems,...(fixHome?[{addr:homeStr,type:'HOME',job:null}]:[])];
    document.getElementById('route-list').innerHTML=fullItems.map((p,i)=>{
      const isEdge=i===0||i===fullItems.length-1;
      const num=i===0?'&#9733;':i===fullItems.length-1?'&#8962;':i;
      const tc=p.type==='PICKUP'?'badge-pickup':p.type==='DELIVER'?'badge-deliver':p.type==='DELIVER_ONLY'?'badge-deliver-only':'';
      const label=p.type==='PICKUP'?'取件':p.type==='DELIVER'?'送件':p.type==='DELIVER_ONLY'?'送件(车上)':'';
      const jobStr=p.job?` #${p.job}`:'';
      return `<div class="r-item">
        <div class="r-num ${isEdge?'sp':''}">${num}</div>
        <div style="flex:1">
          ${tc?`<span class="r-tag ${tc}">${label}${jobStr}</span>`:''}
          <div class="r-addr">${p.addr}</div>
        </div>
      </div>`;
    }).join('');

    // Maps links
    const addrList=fullItems.map(p=>p.addr);
    const mapsEl=document.getElementById('maps-list');
    mapsEl.innerHTML='';
    const CHUNK=9;
    const totalSegs=Math.ceil((addrList.length-1)/CHUNK);
    for(let i=0;i<addrList.length-1;i+=CHUNK){
      const seg=addrList.slice(i,Math.min(i+CHUNK+1,addrList.length));
      const url='https://www.google.com/maps/dir/'+seg.map(a=>encodeURIComponent(a)).join('/');
      const sn=Math.floor(i/CHUNK)+1;
      const div=document.createElement('div');div.className='maps-seg';
      div.innerHTML=`<div class="maps-lbl">${totalSegs>1?'段 '+sn+'/'+totalSegs:'完整路线'} · ${seg.length} 站</div><a href="${url}" target="_blank" class="maps-a">&#9654; 打开 Google Maps</a>`;
      mapsEl.appendChild(div);
    }

    document.getElementById('route-result').style.display='block';
    setStatus('route','✓ 完成','ok');

  }catch(e){ setStatus('route','错误: '+e.message,'error'); console.error(e); }
  finally{ document.getElementById('btn-route').disabled=false; }
}

// ── Orders ────────────────────────────────────────────────────────
function renderOrders(){
  const rec = getTodayRecord();
  document.getElementById('orders-date').textContent = todayKey();
  const jobs = Object.entries(rec.jobs);
  if(!jobs.length){ document.getElementById('orders-list').innerHTML='<div class="empty">暂无订单</div>'; return; }

  let html = '';
  jobs.forEach(([jobId, job])=>{
    // Pickup row
    if(job.addr_pickup){
      const done = job.pickup==='done';
      html += `<div class="order-item">
        <span class="o-badge ${done?'badge-done':'badge-pickup'}">${done?'已取':'取件'}</span>
        <span class="o-job">#${jobId}</span>
        <div class="o-addr" style="${done?'color:var(--muted);text-decoration:line-through':''}">${job.addr_pickup}</div>
        <div class="o-actions">
          ${!done?`<button class="btn-done" onclick="markDone('${jobId}','pickup')">完成</button>`:`<button class="btn-undo" onclick="markUndo('${jobId}','pickup')">撤销</button>`}
        </div>
      </div>`;
    }
    // Deliver row
    if(job.addr_deliver){
      const done = job.deliver==='done';
      html += `<div class="order-item">
        <span class="o-badge ${done?'badge-done':'badge-deliver'}">${done?'已送':'送件'}</span>
        <span class="o-job">#${jobId}</span>
        <div class="o-addr" style="${done?'color:var(--muted);text-decoration:line-through':''}">${job.addr_deliver}</div>
        <div class="o-actions">
          ${!done?`<button class="btn-done" onclick="markDone('${jobId}','deliver')">完成</button>`:`<button class="btn-undo" onclick="markUndo('${jobId}','deliver')">撤销</button>`}
        </div>
      </div>`;
    }
  });
  document.getElementById('orders-list').innerHTML = html;
}

function markDone(jobId, action){
  const rec = getTodayRecord();
  if(!rec.jobs[jobId]) return;
  rec.jobs[jobId][action] = 'done';
  // Count completed
  const allDone = Object.values(rec.jobs).filter(j=>j.deliver==='done').length;
  rec.completedCount = allDone;
  saveDB();
  renderOrders();
  renderStats();
}

function markUndo(jobId, action){
  const rec = getTodayRecord();
  if(!rec.jobs[jobId]) return;
  rec.jobs[jobId][action] = 'pending';
  saveDB();
  renderOrders();
  renderStats();
}

function clearTodayOrders(){
  if(!confirm('确认清空今日订单？')) return;
  db[todayKey()] = {jobs:{}, km:0, completedCount:0};
  saveDB();
  renderOrders();
  renderStats();
}

// ── Stats ─────────────────────────────────────────────────────────
function renderStats(){
  const rec = getTodayRecord();
  const jobs = Object.values(rec.jobs);
  const completed = jobs.filter(j=>j.deliver==='done').length;
  const pending = jobs.filter(j=>j.deliver==='pending'&&j.addr_deliver).length;
  const totalAll = Object.values(db).reduce((s,d)=>s+(d.completedCount||0),0);

  document.getElementById('st-today').textContent = completed;
  document.getElementById('st-pending').textContent = pending;
  document.getElementById('st-km').textContent = rec.km||'—';
  document.getElementById('st-total').textContent = totalAll;

  // History
  const days = Object.entries(db).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  if(!days.length){ document.getElementById('history-list').innerHTML='<div class="empty">暂无历史</div>'; return; }
  const maxCount = Math.max(...days.map(([,d])=>d.completedCount||0),1);
  document.getElementById('history-list').innerHTML = days.map(([date,d])=>{
    const count = d.completedCount||0;
    const pct = Math.round(count/maxCount*100);
    return `<div class="day-row">
      <span class="day-date">${date}</span>
      <div class="day-bar-wrap"><div class="day-bar" style="width:${pct}%"></div></div>
      <span class="day-num">${count}</span>
    </div>`;
  }).join('');
}
